<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>永安物流中心｜營運儀表板</title>
  <link rel="icon" type="image/svg+xml" href="favicon-worklog-admin.svg">
  <link rel="apple-touch-icon" href="favicon-worklog-admin.svg">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f1f5f9; }
    iframe { width: 100%; height: calc(100% + 55px); margin-top: -55px; border: none; }
    #msg {
      color: #64748b; font-family: -apple-system, "Hiragino Sans", "Noto Sans TC", sans-serif; text-align: center;
      padding-top: 40vh; font-size: 14px; display: block;
    }
  </style>
</head>
<body>
  <div id="msg">載入中...</div>
  <iframe id="app" allow="camera; clipboard-write"></iframe>

  <script>
    var search = window.location.search || '';
    var qs = search ? (search.charAt(0) === '?' ? search : '?' + search) : '';
    var iframe = document.getElementById('app');
    iframe.addEventListener('load', function () { document.getElementById('msg').style.display = 'none'; });
    iframe.src = 'https://script.google.com/macros/s/AKfycbyFugaIiv_I5yTfj-AYwo6yEadPQLhKtmmb5MeIlQmeyB4iTYNdjZWpBH7ZIy1gDwSy/exec?p=board' + qs;
  </script>
</body>
</html>

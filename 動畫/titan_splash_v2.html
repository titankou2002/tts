<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鈦傳速｜V2 數字雨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;700&display=swap');

  :root {
    --bg: #020a12;
    --blue: #0066ff;
    --cyan: #00aaff;
    --glow: rgba(0, 170, 255, 0.15);
    --text: #e0f0ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans TC', sans-serif;
  }

  /* 數字雨 Canvas */
  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.55;
  }

  /* 中央光暈 */
  .center-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(0,100,255,0.12) 0%, transparent 70%);
    z-index: 1;
    pointer-events: none;
  }

  /* 主內容卡片 */
  .card {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px 60px;
    background: rgba(2, 10, 18, 0.85);
    border: 1px solid rgba(0, 170, 255, 0.2);
    border-radius: 4px;
    backdrop-filter: blur(12px);
    box-shadow:
      0 0 60px rgba(0, 100, 255, 0.15),
      inset 0 0 40px rgba(0, 50, 100, 0.1);
    animation: cardIn 1s ease both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* 卡片四角 */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: var(--cyan);
    border-style: solid;
    opacity: 0.6;
  }
  .card::before {
    top: -1px; left: -1px;
    border-width: 2px 0 0 2px;
  }
  .card::after {
    bottom: -1px; right: -1px;
    border-width: 0 2px 2px 0;
  }

  /* Logo */
  .logo-wrap {
    position: relative;
    margin-bottom: 24px;
  }
  .logo-wrap svg {
    width: 72px;
    height: 72px;
    filter: drop-shadow(0 0 16px rgba(0,170,255,0.7));
  }

  /* 品牌文字 */
  .brand-name {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 10px;
    color: #fff;
    text-shadow:
      0 0 20px rgba(0,170,255,0.8),
      0 0 40px rgba(0,100,255,0.4);
    margin-bottom: 6px;
    animation: textFlicker 4s ease-in-out infinite;
  }

  @keyframes textFlicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.7; }
    97% { opacity: 1; }
    98% { opacity: 0.85; }
  }

  .brand-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: rgba(0, 170, 255, 0.6);
    margin-bottom: 30px;
    text-transform: uppercase;
  }

  /* 分隔線 */
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    margin-bottom: 24px;
    opacity: 0.4;
  }

  /* 問候語 */
  .welcome-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--cyan);
    margin-bottom: 28px;
    position: relative;
  }

  /* 打字游標效果 */
  .welcome-text::after {
    content: '▌';
    animation: cursor-blink 1s step-end infinite;
    margin-left: 2px;
    color: var(--cyan);
  }
  @keyframes cursor-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* 進度條 */
  .progress-wrap {
    width: 240px;
    margin-bottom: 20px;
  }
  .progress-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(0,170,255,0.4);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .progress-track {
    width: 100%;
    height: 3px;
    background: rgba(0,170,255,0.1);
    border-radius: 0;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    box-shadow: 0 0 8px var(--cyan);
    animation: fill-progress 1.5s ease-out both 0.5s;
    width: 0;
  }
  @keyframes fill-progress {
    to { width: 100%; }
  }

  /* 日期 */
  .date-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(224, 240, 255, 0.3);
  }

  /* 版本 */
  .version {
    position: fixed;
    bottom: 20px;
    right: 24px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(0,170,255,0.15);
    z-index: 10;
  }

  /* 頂部水平掃描線 */
  .h-scan {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--cyan) 50%, transparent 100%);
    opacity: 0;
    animation: h-sweep 5s ease-in-out infinite 2s;
    z-index: 2;
  }
  @keyframes h-sweep {
    0%   { top: 0; opacity: 0; }
    5%   { opacity: 0.3; }
    95%  { opacity: 0.2; }
    100% { top: 100vh; opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="rain"></canvas>
<div class="center-glow"></div>
<div class="h-scan"></div>

<div class="card">
  <div class="logo-wrap">
    <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M244.837 442H167.334V213.34H65V70H244.837V442Z
               M350.745 320.275H350.934V442H263.648V368.055H264.255L286.222 347.442V412.422H325.35V320.275L350.745 298.601V320.275Z
               M363.785 253.258L264.049 343.323L264.044 172.055L363.785 253.258Z
               M448 213.34H347.923L312.734 179.211H426.932V104.129H263.648V70H448V213.34Z"
            fill="url(#g2)"/>
      <defs>
        <linearGradient id="g2" x1="65" y1="70" x2="448" y2="442" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#00aaff"/>
          <stop offset="100%" stop-color="#0044cc"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <div class="brand-name">鈦傳速</div>
  <div class="brand-sub">INTELLIGENT LOGISTICS CONTROL</div>
  <div class="divider"></div>
  <div class="welcome-text" id="welcomeText">WELCOME</div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>SYSTEM LOADING</span>
      <span id="pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </div>

  <div class="date-text" id="dateText"></div>
</div>

<div class="version">V11</div>

<script>
  // 日期
  const now = new Date();
  const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('dateText').textContent =
    `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${days[now.getDay()]}`;

  // 問候語打字效果
  const savedName = localStorage.getItem('titan_driver_name') || '';
  const fullText = savedName ? `歡迎登入，${savedName}` : 'SYSTEM ONLINE';
  const el = document.getElementById('welcomeText');
  el.textContent = '';
  let i = 0;
  setTimeout(() => {
    const t = setInterval(() => {
      el.textContent = fullText.slice(0, ++i);
      if (i >= fullText.length) clearInterval(t);
    }, 60);
  }, 600);

  // 進度百分比計數
  let pct = 0;
  const pctEl = document.getElementById('pct');
  const pctTimer = setInterval(() => {
    pct = Math.min(100, pct + Math.floor(Math.random() * 8) + 2);
    pctEl.textContent = pct + '%';
    if (pct >= 100) clearInterval(pctTimer);
  }, 80);

  // 數字雨
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const chars = '0123456789ABCDEF鈦傳速GPS北台'.split('');
  const fontSize = 13;
  const cols = Math.floor(canvas.width / fontSize);
  const drops = Array(cols).fill(1);

  function drawRain() {
    ctx.fillStyle = 'rgba(2, 10, 18, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px Share Tech Mono, monospace';
    drops.forEach((y, i) => {
      const char = chars[Math.floor(Math.random() * chars.length)];
      const alpha = Math.random() * 0.5 + 0.1;
      // 漸層：靠近中央偏亮
      const cx = Math.abs(i / cols - 0.5);
      const brightness = Math.max(0.05, 0.4 - cx * 0.6);
      ctx.fillStyle = `rgba(0, 150, 255, ${brightness * alpha * 3})`;
      ctx.fillText(char, i * fontSize, y * fontSize);
      if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    });
  }
  setInterval(drawRain, 40);

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>
</body>
</html>

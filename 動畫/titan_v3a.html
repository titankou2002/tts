<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鈦傳速｜V3-A 電路掃描</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;700&display=swap');
  :root {
    --bg: #03070f;
    --blue: #1a6fff;
    --cyan: #00d4ff;
    --cyan2: #00aacc;
    --panel: rgba(4,10,22,0.96);
    --text: #c8e0ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace;
  }

  #loadingOverlay {
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    transition: opacity 1.4s ease;
  }
  #loadingOverlay.fade-out { opacity:0; pointer-events:none; }

  /* 電路板 Canvas */
  #circuitCanvas { position:fixed; inset:0; z-index:0; }

  /* 全螢幕掃描線（從上往下） */
  .global-scan {
    position:fixed; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent 0%, var(--cyan) 40%, rgba(0,212,255,0.4) 60%, transparent 100%);
    box-shadow: 0 0 20px var(--cyan), 0 6px 30px rgba(0,212,255,0.2);
    z-index:5;
    animation: gscan 3.5s ease-in-out infinite;
    opacity:0;
  }
  @keyframes gscan {
    0%   { top:-2px; opacity:0; }
    3%   { opacity:0.6; }
    97%  { opacity:0.4; }
    100% { top:100vh; opacity:0; }
  }

  /* 頂部狀態列 */
  .top-bar {
    position:fixed; top:0; left:0; right:0;
    padding:12px 24px; display:flex; justify-content:space-between; align-items:center;
    font-size:9px; letter-spacing:2px; color:rgba(0,212,255,0.3);
    border-bottom:1px solid rgba(0,212,255,0.06); z-index:200;
    background: linear-gradient(180deg, rgba(3,7,15,0.98), transparent);
  }
  .dot { display:inline-block; width:5px; height:5px; background:var(--cyan); border-radius:50%; margin-right:8px; box-shadow:0 0 6px var(--cyan); animation:db 1.5s ease-in-out infinite; }
  @keyframes db { 0%,100%{opacity:1}50%{opacity:0.2} }

  /* 主面板 */
  .panel {
    position:relative; z-index:10;
    width:400px;
    border:1px solid rgba(0,212,255,0.12);
    background: var(--panel);
    backdrop-filter: blur(20px);
    padding:0;
    overflow:hidden;
    box-shadow: 0 0 80px rgba(26,111,255,0.08), 0 0 2px rgba(0,212,255,0.1);
    animation: panelIn 0.8s ease both;
  }
  @keyframes panelIn { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }

  /* 面板頂部色條 */
  .panel-header {
    height:3px;
    background: linear-gradient(90deg, var(--blue), var(--cyan), var(--blue));
    background-size: 200% 100%;
    animation: header-slide 2s linear infinite;
  }
  @keyframes header-slide {
    0%  { background-position: 0% 0; }
    100%{ background-position: 200% 0; }
  }

  /* 面板內容 */
  .panel-body { padding:32px 32px 28px; }

  /* Logo + 品牌 */
  .logo-row { display:flex; align-items:center; gap:18px; margin-bottom:10px; animation:fiu 0.8s 0.2s ease both; }
  .logo-row svg { width:52px; height:52px; filter:drop-shadow(0 0 12px rgba(0,212,255,0.7)); }
  .brand-name { font-family:'Noto Sans TC',sans-serif; font-size:30px; font-weight:700; letter-spacing:6px; color:#fff; text-shadow:0 0 24px rgba(0,212,255,0.4); }
  .brand-sub { font-size:9px; letter-spacing:5px; color:rgba(0,212,255,0.3); margin-bottom:24px; animation:fiu 0.8s 0.4s ease both; }
  @keyframes fiu { from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)} }

  /* 分隔線 */
  .sep { width:100%; height:1px; background:rgba(0,212,255,0.08); margin-bottom:20px; }

  /* 資訊格 2x3 */
  .info-grid {
    display:grid; grid-template-columns:1fr 1fr 1fr;
    gap:1px; background:rgba(0,212,255,0.06);
    border:1px solid rgba(0,212,255,0.06);
    margin-bottom:20px;
    animation:fiu 0.8s 0.6s ease both; opacity:0;
  }
  .info-cell { background:var(--panel); padding:10px 12px; }
  .ic-label { font-size:7px; letter-spacing:2px; color:rgba(0,212,255,0.28); margin-bottom:3px; }
  .ic-val { font-size:12px; letter-spacing:1px; }
  .ic-val.c { color:var(--cyan); }
  .ic-val.w { color:#fff; }
  .ic-val.g { color:#00ff88; }
  .ic-val.o { color:#f59e0b; }

  /* 電路傳輸條 */
  .data-pipes {
    display:flex; flex-direction:column; gap:5px;
    margin-bottom:20px;
    animation:fiu 0.8s 0.8s ease both; opacity:0;
  }
  .pipe { height:3px; background:rgba(0,212,255,0.06); border-radius:2px; overflow:hidden; position:relative; }
  .pipe-fill {
    height:100%; width:0%;
    border-radius:2px;
    position:relative;
    animation: pipe-run 1.2s ease forwards;
  }
  .pipe-fill::after {
    content:''; position:absolute;
    right:0; top:-2px; bottom:-2px; width:8px;
    background:inherit; filter:blur(3px); opacity:0.8;
  }
  .pipe:nth-child(1) .pipe-fill { background:var(--cyan); animation-delay:0.9s; width:0; animation-name:pipe-run; }
  .pipe:nth-child(2) .pipe-fill { background:var(--blue); animation-delay:1.0s; }
  .pipe:nth-child(3) .pipe-fill { background:var(--cyan2); animation-delay:1.1s; }
  .pipe:nth-child(4) .pipe-fill { background:#6366f1; animation-delay:1.2s; }
  @keyframes pipe-run {
    from { width:0%; }
    to   { width:100%; }
  }
  .pipe-label { position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:7px; letter-spacing:1px; color:rgba(255,255,255,0.2); z-index:1; }

  /* LOG */
  .boot-log { height:48px; overflow:hidden; margin-bottom:20px; animation:fiu 0.8s 1s ease both; opacity:0; }
  .log-line { font-size:9px; letter-spacing:1px; color:rgba(0,212,255,0.28); display:flex; gap:8px; margin-bottom:4px; }
  .log-line.active { color:rgba(0,212,255,0.85); }
  .log-line .tag { color:var(--cyan); min-width:32px; }

  /* 進度條 */
  .progress-wrap { animation:fiu 0.8s 1.1s ease both; opacity:0; }
  .progress-meta { display:flex; justify-content:space-between; font-size:9px; letter-spacing:2px; color:rgba(0,212,255,0.28); margin-bottom:6px; }
  .progress-track { width:100%; height:2px; background:rgba(0,212,255,0.06); overflow:visible; position:relative; }
  .progress-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--blue),var(--cyan)); box-shadow:0 0 8px var(--cyan); transition:width 0.3s ease; position:relative; }
  .progress-fill::after { content:''; position:absolute; right:-1px; top:-3px; width:8px; height:8px; background:var(--cyan); border-radius:50%; box-shadow:0 0 10px var(--cyan); }

  /* 面板四角 L */
  .cl { position:absolute; width:12px; height:12px; border-color:var(--cyan); border-style:solid; opacity:0.4; }
  .cl.tl{top:-1px;left:-1px;border-width:2px 0 0 2px}
  .cl.tr{top:-1px;right:-1px;border-width:2px 2px 0 0}
  .cl.bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px}
  .cl.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}

  .clock { position:fixed; bottom:20px; left:24px; font-size:10px; letter-spacing:3px; color:rgba(0,212,255,0.18); z-index:200; }
  .version { position:fixed; bottom:20px; right:24px; font-size:9px; letter-spacing:3px; color:rgba(0,212,255,0.1); z-index:200; }

  .cd { position:fixed; width:18px; height:18px; z-index:200; opacity:0.25; }
  .cd::before,.cd::after { content:''; position:absolute; background:var(--cyan); }
  .cd::before{width:100%;height:1px} .cd::after{width:1px;height:100%}
  .cd.tl{top:14px;left:14px} .cd.tl::before{top:0;left:0} .cd.tl::after{top:0;left:0}
  .cd.tr{top:14px;right:14px} .cd.tr::before{top:0;right:0} .cd.tr::after{top:0;right:0}
  .cd.bl{bottom:14px;left:14px} .cd.bl::before{bottom:0;left:0} .cd.bl::after{bottom:0;left:0}
  .cd.br{bottom:14px;right:14px} .cd.br::before{bottom:0;right:0} .cd.br::after{bottom:0;right:0}
</style>
</head>
<body>
<canvas id="circuitCanvas"></canvas>
<div class="global-scan"></div>
<div class="cd tl"></div><div class="cd tr"></div><div class="cd bl"></div><div class="cd br"></div>

<div id="loadingOverlay">
  <div class="top-bar">
    <span><span class="dot"></span>TITAN CONTROL SYSTEM</span>
    <span id="clockTop">--:--:--</span>
    <span>CIRCUIT SCAN ACTIVE</span>
  </div>

  <div class="panel">
    <div class="cl tl"></div><div class="cl tr"></div><div class="cl bl"></div><div class="cl br"></div>
    <div class="panel-header"></div>
    <div class="panel-body">

      <div class="logo-row">
        <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M244.837 442H167.334V213.34H65V70H244.837V442Z M350.745 320.275H350.934V442H263.648V368.055H264.255L286.222 347.442V412.422H325.35V320.275L350.745 298.601V320.275Z M363.785 253.258L264.049 343.323L264.044 172.055L363.785 253.258Z M448 213.34H347.923L312.734 179.211H426.932V104.129H263.648V70H448V213.34Z" fill="url(#ga)"/>
          <defs><linearGradient id="ga" x1="65" y1="70" x2="448" y2="442" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#1a6fff"/></linearGradient></defs>
        </svg>
        <div class="brand-name">鈦傳速</div>
      </div>
      <div class="brand-sub">INTELLIGENT LOGISTICS CONTROL SYSTEM</div>
      <div class="sep"></div>

      <!-- 資訊格 -->
      <div class="info-grid">
        <div class="info-cell"><div class="ic-label">DATE</div><div class="ic-val w" id="infoDate">--/--</div></div>
        <div class="info-cell"><div class="ic-label">TIME</div><div class="ic-val c" id="infoTime">--:--</div></div>
        <div class="info-cell"><div class="ic-label">VERSION</div><div class="ic-val c">V11</div></div>
        <div class="info-cell"><div class="ic-label">FLEET</div><div class="ic-val g">3 ONLINE</div></div>
        <div class="info-cell"><div class="ic-label">ORDERS</div><div class="ic-val o" id="orderVal">--</div></div>
        <div class="info-cell"><div class="ic-label">STATUS</div><div class="ic-val g" id="statusVal">INIT</div></div>
      </div>

      <!-- 資料傳輸管道 -->
      <div class="data-pipes">
        <div class="pipe"><div class="pipe-fill"></div><div class="pipe-label">GPS MODULE</div></div>
        <div class="pipe"><div class="pipe-fill"></div><div class="pipe-label">DATABASE</div></div>
        <div class="pipe"><div class="pipe-fill"></div><div class="pipe-label">AUTH SERVER</div></div>
        <div class="pipe"><div class="pipe-fill"></div><div class="pipe-label">DISPATCH ENGINE</div></div>
      </div>

      <!-- LOG -->
      <div class="boot-log"><div id="bootLog"></div></div>

      <!-- 進度條 -->
      <div class="progress-wrap">
        <div class="progress-meta"><span id="progressLabel">INITIALIZING</span><span id="progressPct">0%</span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
  </div>

  <div class="clock" id="clockBottom"></div>
  <div class="version">V11</div>
</div>

<div id="mainDemo" style="display:none;position:fixed;inset:0;background:#03070f;z-index:50;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:'Share Tech Mono',monospace;">
  <div style="font-size:20px;color:#00d4ff;letter-spacing:4px;">✓ SYSTEM READY</div>
  <div style="font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:3px;">載入完成，主畫面將從這裡顯示</div>
</div>

<script>
// 電路板背景（直角連線版）
const canvas = document.getElementById('circuitCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const nodes = [];
for(let i=0;i<70;i++){
  nodes.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    vx:(Math.random()-0.5)*0.25,
    vy:(Math.random()-0.5)*0.25,
    pulse:Math.random()*Math.PI*2,
    speed:0.008+Math.random()*0.012
  });
}

// 電流粒子
const sparks = [];
function addSpark(x1,y1,x2,y2){
  sparks.push({x1,y1,x2,y2,mid_x:x1,mid_y:y2,progress:0,speed:0.04+Math.random()*0.06});
}

function drawCircuit(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  nodes.forEach(n=>{
    n.x+=n.vx; n.y+=n.vy; n.pulse+=n.speed;
    if(n.x<0||n.x>canvas.width) n.vx*=-1;
    if(n.y<0||n.y>canvas.height) n.vy*=-1;
  });

  // 直角連線
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x;
      const dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<130){
        const alpha=(1-d/130)*0.1;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x,nodes[i].y);
        ctx.lineTo(nodes[i].x,nodes[j].y);
        ctx.lineTo(nodes[j].x,nodes[j].y);
        ctx.strokeStyle=`rgba(26,111,255,${alpha})`;
        ctx.lineWidth=0.7;
        ctx.stroke();

        // 偶爾在連線上加電流粒子
        if(Math.random()<0.0005) addSpark(nodes[i].x,nodes[i].y,nodes[j].x,nodes[j].y);
      }
    }
  }

  // 電流粒子
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.progress+=s.speed;
    if(s.progress>=1){ sparks.splice(i,1); continue; }

    let px,py;
    if(s.progress<0.5){
      px=s.x1; py=s.y1+(s.y2-s.y1)*(s.progress*2);
    } else {
      px=s.x1+(s.x2-s.x1)*((s.progress-0.5)*2); py=s.y2;
    }
    ctx.beginPath();
    ctx.arc(px,py,2,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,212,255,${0.8*(1-s.progress)})`;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px,py,4,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,212,255,${0.2*(1-s.progress)})`;
    ctx.fill();
  }

  // 節點
  nodes.forEach(n=>{
    const g=Math.sin(n.pulse)*0.5+0.5;
    ctx.beginPath(); ctx.arc(n.x,n.y,2,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,180,255,${0.15+g*0.3})`; ctx.fill();
  });
}
setInterval(drawCircuit,40);
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});

// 時鐘
function updateClock(){
  const n=new Date();
  const days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const t=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
  const d=`${n.getFullYear()}/${String(n.getMonth()+1).padStart(2,'0')}/${String(n.getDate()).padStart(2,'0')}`;
  document.getElementById('clockTop').textContent=t;
  document.getElementById('clockBottom').textContent=d+' '+days[n.getDay()]+'　'+t;
  document.getElementById('infoTime').textContent=t.slice(0,5);
  document.getElementById('infoDate').textContent=`${n.getMonth()+1}/${n.getDate()}`;
}
setInterval(updateClock,1000); updateClock();

// 訂單數隨機跳動
setTimeout(()=>{ document.getElementById('orderVal').textContent='21'; },1200);

// LOG
const logs=[
  {tag:'OK',msg:'CIRCUIT BOARD INITIALIZED'},
  {tag:'OK',msg:'NODE MESH: 70 ACTIVE'},
  {tag:'OK',msg:'GPS MODULE CONNECTED'},
  {tag:'OK',msg:'FLEET: 3 VEHICLES ONLINE'},
  {tag:'..', msg:'LOADING DISPATCH DATA'},
];
const logEl=document.getElementById('bootLog');
let li=0;
function addLog(){
  if(li>=logs.length)return;
  const l=logs[li];
  const d=document.createElement('div');
  d.className='log-line active';
  d.innerHTML=`<span class="tag">[${l.tag}]</span><span>${l.msg}</span>`;
  logEl.querySelectorAll('.active').forEach(e=>e.classList.remove('active'));
  logEl.appendChild(d); li++;
  const lines=logEl.querySelectorAll('.log-line');
  if(lines.length>3) lines[0].remove();
}

const labels=['INITIALIZING','CONNECTING','VERIFYING','SYNCING','READY'];
let pct=0;
const fillEl=document.getElementById('progressFill');
const pctEl=document.getElementById('progressPct');
const labelEl=document.getElementById('progressLabel');
const statusEl=document.getElementById('statusVal');
const timer=setInterval(()=>{
  pct=Math.min(100,pct+Math.floor(Math.random()*5)+2);
  fillEl.style.width=pct+'%';
  pctEl.textContent=pct+'%';
  labelEl.textContent=labels[Math.floor((pct/100)*(labels.length-1))];
  statusEl.textContent=labels[Math.floor((pct/100)*(labels.length-1))];
  if(pct%16===0) addLog();
  if(pct>=100){
    clearInterval(timer);
    labelEl.textContent='SYSTEM READY';
    statusEl.textContent='ONLINE';
    setTimeout(()=>{
      document.getElementById('loadingOverlay').classList.add('fade-out');
      setTimeout(()=>{
        document.getElementById('loadingOverlay').style.display='none';
        document.getElementById('mainDemo').style.display='flex';
      },1400);
    },600);
  }
},80);
setTimeout(addLog,400);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 辨識進度動畫預覽</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --cyan: #38bdf8;
    --green: #22c55e;
    --purple: #a855f7;
    --warning: #fbbf24;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Noto Sans TC', sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .demo-btn {
    background: rgba(56,189,248,0.1);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 14px 32px; border-radius: 8px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    font-family: 'Rajdhani', monospace; letter-spacing: 2px;
    transition: .2s;
  }
  .demo-btn:hover { background: rgba(56,189,248,0.2); }

  /* ══ Overlay ══ */
  #aiScanOverlay {
    position: fixed; inset: 0;
    background: rgba(8,14,26,0.97);
    backdrop-filter: blur(12px);
    z-index: 99999;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #aiScanOverlay::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(56,189,248,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,189,248,.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  /* 角落裝飾 */
  .cf { position: absolute; width: 56px; height: 56px; pointer-events: none; }
  .cf::before,.cf::after { content:''; position:absolute; background:var(--cyan); }
  .cf::before { width:100%; height:2px; top:0; left:0; }
  .cf::after  { width:2px; height:100%; top:0; left:0; }
  .cf-tl { top:20px; left:20px; }
  .cf-tr { top:20px; right:20px; transform:scaleX(-1); }
  .cf-bl { bottom:20px; left:20px; transform:scaleY(-1); }
  .cf-br { bottom:20px; right:20px; transform:scale(-1,-1); }

  /* 頂部狀態列 */
  .topbar {
    position: absolute; top: 28px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:16px;
    font-family:'Rajdhani',monospace; font-size:11px;
    letter-spacing:3px; color:rgba(56,189,248,0.45); white-space:nowrap;
  }
  .topbar .dot {
    width:5px; height:5px; background:var(--cyan); border-radius:50%;
    box-shadow:0 0 8px var(--cyan); animation:blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

  /* 完成徽章 */
  .complete-badge {
    position:absolute; top:28px; right:28px;
    background:rgba(34,197,94,0.15); border:1px solid var(--green);
    color:var(--green); padding:6px 18px; border-radius:20px;
    font-family:'Rajdhani',monospace; font-size:12px; letter-spacing:2px;
    display:none; animation:badgePop .4s ease;
  }
  @keyframes badgePop { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }

  /* 主體 */
  .scan-body {
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:28px;
    width:100%; max-width:500px; padding:20px;
  }

  /* 圖片掃描框 */
  .frame-wrap { position:relative; width:210px; height:158px; }
  #scanThumb {
    width:100%; height:100%; object-fit:cover; border-radius:4px; display:block;
    opacity:0.55; filter:brightness(0.7) saturate(0.3);
  }
  .scan-beam {
    position:absolute; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--cyan), var(--cyan), transparent);
    box-shadow:0 0 14px var(--cyan), 0 0 32px rgba(56,189,248,0.5);
    top:0; animation:beam 1.8s cubic-bezier(0.4,0,0.6,1) infinite; z-index:3;
  }
  @keyframes beam {
    0%{top:0%;opacity:0} 5%{opacity:1} 95%{opacity:1} 100%{top:100%;opacity:0}
  }
  .sc { position:absolute; width:16px; height:16px; z-index:4; }
  .sc::before,.sc::after { content:''; position:absolute; background:var(--cyan); box-shadow:0 0 6px var(--cyan); }
  .sc::before { width:100%; height:2px; top:0; left:0; }
  .sc::after  { width:2px; height:100%; top:0; left:0; }
  .sc-tl{top:-2px;left:-2px} .sc-tr{top:-2px;right:-2px;transform:scaleX(-1)}
  .sc-bl{bottom:-2px;left:-2px;transform:scaleY(-1)} .sc-br{bottom:-2px;right:-2px;transform:scale(-1,-1)}
  #detectDots { position:absolute; inset:0; z-index:5; }
  .detect-dot {
    position:absolute; width:8px; height:8px;
    background:var(--green); border-radius:50%; box-shadow:0 0 10px var(--green);
    opacity:0; animation:dotPop .4s ease forwards;
  }
  @keyframes dotPop { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.5);opacity:1} 100%{transform:scale(1);opacity:1} }
  .ocr-stream {
    position:absolute; bottom:-26px; left:0; right:0;
    font-family:'Rajdhani',monospace; font-size:10px;
    color:var(--green); letter-spacing:1px;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis; text-align:center;
    animation:streamFade .3s ease;
  }
  @keyframes streamFade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

  /* 狀態文字 */
  .scan-status { text-align:center; }
  .scan-title {
    font-family:'Rajdhani',monospace; font-size:22px; font-weight:700;
    color:#fff; letter-spacing:4px; text-transform:uppercase; margin-bottom:6px;
  }
  .scan-sub { font-size:13px; color:rgba(255,255,255,0.4); letter-spacing:1px; }
  #scanFile {
    font-size:12px; color:var(--cyan); font-family:'Rajdhani',monospace;
    margin-top:6px; letter-spacing:1px; min-height:18px;
  }

  /* 進度條 */
  .prog-wrap { width:100%; }
  .prog-meta {
    display:flex; justify-content:space-between;
    font-family:'Rajdhani',monospace; font-size:12px;
    color:rgba(255,255,255,0.35); letter-spacing:2px; margin-bottom:10px;
  }
  #progPct { color:var(--cyan); font-weight:700; }
  .prog-track {
    width:100%; height:4px; background:rgba(255,255,255,0.06);
    border-radius:2px; overflow:visible; position:relative;
  }
  #progBar {
    height:100%; width:0%; border-radius:2px;
    background:linear-gradient(90deg,#0ea5e9,var(--cyan),#7dd3fc);
    box-shadow:0 0 10px var(--cyan);
    transition:width .5s cubic-bezier(0.4,0,0.2,1); position:relative;
  }
  #progBar::after {
    content:''; position:absolute; right:-5px; top:-4px;
    width:12px; height:12px; background:#fff; border-radius:50%;
    box-shadow:0 0 10px var(--cyan),0 0 20px var(--cyan);
  }

  /* 縮圖列 */
  .thumb-row {
    display:flex; gap:8px; flex-wrap:wrap;
    justify-content:center; width:100%;
  }
  .ti {
    width:46px; height:46px; border-radius:6px;
    border:1px solid rgba(255,255,255,0.1);
    overflow:hidden; position:relative; flex-shrink:0; transition:.3s;
  }
  .ti img { width:100%; height:100%; object-fit:cover; filter:brightness(0.5) saturate(0.3); transition:.4s; }
  .ti.done img { filter:brightness(0.85) saturate(0.8); }
  .ti.active { border-color:var(--cyan); box-shadow:0 0 14px var(--cyan); transform:scale(1.12); }
  .ti .ck {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:18px; opacity:0; transition:.3s; background:rgba(34,197,94,0.3);
  }
  .ti.done .ck { opacity:1; }

  /* 統計 */
  .stats { display:flex; gap:28px; font-family:'Rajdhani',monospace; }
  .sv { font-size:30px; font-weight:700; line-height:1; color:#fff; }
  .sv.c { color:var(--cyan); } .sv.g { color:var(--green); } .sv.w { color:var(--warning); }
  .sl { font-size:10px; letter-spacing:2px; color:rgba(255,255,255,0.3); margin-top:4px; }

  /* 取消 */
  .cancel-btn {
    position:absolute; bottom:28px; right:28px;
    background:transparent; border:1px solid rgba(255,255,255,0.15);
    color:rgba(255,255,255,0.3); padding:8px 18px; border-radius:6px;
    font-family:'Rajdhani',monospace; font-size:12px; letter-spacing:2px;
    cursor:pointer; transition:.2s;
  }
  .cancel-btn:hover { border-color:var(--danger); color:var(--danger); }

  /* 背景掃描線 */
  .h-line {
    position:absolute; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(56,189,248,0.12),transparent);
    animation:hScan 5s linear infinite; pointer-events:none;
  }
  @keyframes hScan { 0%{top:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{top:100%;opacity:0} }
</style>
</head>
<body>

<button class="demo-btn" onclick="startDemo()">▶ 點擊預覽 AI 辨識動畫</button>

<div id="aiScanOverlay">
  <div class="cf cf-tl"></div><div class="cf cf-tr"></div>
  <div class="cf cf-bl"></div><div class="cf cf-br"></div>
  <div class="h-line"></div>

  <div class="topbar">
    <span class="dot"></span>
    <span>BIGT AI · OCR ENGINE</span>
    <span>·</span>
    <span id="sysTime">--:--:--</span>
    <span>·</span>
    <span>VISION v3.5</span>
  </div>

  <div class="complete-badge" id="completeBadge">✓ SCAN COMPLETE</div>

  <div class="scan-body">
    <div class="frame-wrap">
      <img id="scanThumb" src="" alt="">
      <div class="scan-beam" id="scanBeam"></div>
      <div class="sc sc-tl"></div><div class="sc sc-tr"></div>
      <div class="sc sc-bl"></div><div class="sc sc-br"></div>
      <div id="detectDots"></div>
      <div class="ocr-stream" id="ocrStream">INITIALIZING...</div>
    </div>

    <div class="scan-status">
      <div class="scan-title" id="scanTitle">AI 圖像辨識</div>
      <div class="scan-sub" id="scanSub">正在分析單據內容，請稍候</div>
      <div id="scanFile">準備中...</div>
    </div>

    <div class="prog-wrap">
      <div class="prog-meta">
        <span id="progText">PROCESSING 0 / 0</span>
        <span id="progPct">0%</span>
      </div>
      <div class="prog-track"><div id="progBar"></div></div>
    </div>

    <div class="thumb-row" id="thumbRow"></div>

    <div class="stats">
      <div><div class="sv c" id="stTotal">0</div><div class="sl">總計</div></div>
      <div><div class="sv g" id="stDone">0</div><div class="sl">已完成</div></div>
      <div><div class="sv w" id="stLeft">0</div><div class="sl">待處理</div></div>
    </div>
  </div>

  <button class="cancel-btn" onclick="stopDemo()">✕ 取消辨識</button>
</div>

<script>
setInterval(() => {
  const el = document.getElementById('sysTime');
  if (el) el.textContent = new Date().toTimeString().slice(0,8);
}, 1000);

const COLORS = ['#1e3a5f','#1a2e1a','#2d1b3d','#2e1a1a','#1e2d3d','#2d2a1a'];
const SNIPPETS = [
  '桃園市桃園區中山路 123 號',
  '客戶：漢樺建材有限公司',
  '重量：1250 KG',
  '單號：AA-20250301-089',
  '聯絡人：王先生 0912-345-678',
  '新竹市東區光復路二段 101 號',
  '時段：12:00前 / 重量：850 KG',
  '高雅瓷 EE-20250301-044',
];

let timer=null, streamTimer=null, dotTimer=null;
let idx=0, total=6;

function makeFake(color) {
  const c=document.createElement('canvas'); c.width=220; c.height=165;
  const ctx=c.getContext('2d');
  ctx.fillStyle=color; ctx.fillRect(0,0,220,165);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  [[10,10,200,8],[10,26,150,5],[10,36,180,5],[10,46,120,5],
   [10,62,200,8],[10,74,160,5],[10,84,140,5]].forEach(([x,y,w,h])=>ctx.fillRect(x,y,w,h));
  return c.toDataURL();
}

function startDemo() {
  idx=0; total=6;
  document.getElementById('aiScanOverlay').style.display='flex';
  document.getElementById('completeBadge').style.display='none';
  document.getElementById('scanBeam').style.animationPlayState='running';
  document.getElementById('progBar').style.width='0%';

  const row=document.getElementById('thumbRow'); row.innerHTML='';
  for(let i=0;i<total;i++){
    const d=document.createElement('div'); d.className='ti'; d.id='ti-'+i;
    const img=document.createElement('img'); img.src=makeFake(COLORS[i%COLORS.length]);
    const ck=document.createElement('div'); ck.className='ck'; ck.textContent='✓';
    d.appendChild(img); d.appendChild(ck); row.appendChild(d);
  }

  document.getElementById('stTotal').textContent=total;
  document.getElementById('stDone').textContent=0;
  document.getElementById('stLeft').textContent=total;
  runNext();
}

function runNext() {
  if(idx>=total){ finishDemo(); return; }

  document.querySelectorAll('.ti').forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.getElementById('scanThumb').src=makeFake(COLORS[idx%COLORS.length]);
  document.getElementById('scanTitle').textContent='AI 圖像辨識';
  document.getElementById('scanSub').textContent=`正在分析第 ${idx+1} 張單據`;
  document.getElementById('scanFile').textContent=`IMG_${String(idx+1).padStart(3,'0')}.jpg`;
  document.getElementById('progText').textContent=`PROCESSING ${idx+1} / ${total}`;
  const pct=Math.round((idx/total)*100);
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('progBar').style.width=pct+'%';

  let si=0;
  clearInterval(streamTimer);
  streamTimer=setInterval(()=>{
    const el=document.getElementById('ocrStream');
    el.style.animation='none'; el.offsetHeight;
    el.style.animation='streamFade .3s ease';
    el.textContent=SNIPPETS[(idx*3+si)%SNIPPETS.length]; si++;
  },380);

  const wrap=document.getElementById('detectDots'); wrap.innerHTML='';
  let dc=0;
  const addDot=()=>{
    if(dc>=5) return;
    const dot=document.createElement('div'); dot.className='detect-dot';
    dot.style.left=(8+Math.random()*84)+'%';
    dot.style.top=(8+Math.random()*84)+'%';
    wrap.appendChild(dot); dc++;
    dotTimer=setTimeout(addDot,270);
  };
  setTimeout(addDot,250);

  timer=setTimeout(()=>{
    clearInterval(streamTimer);
    document.getElementById('ocrStream').textContent='✓ 辨識完成';
    const t=document.getElementById('ti-'+idx);
    if(t){t.classList.remove('active');t.classList.add('done');}
    document.getElementById('stDone').textContent=idx+1;
    document.getElementById('stLeft').textContent=total-idx-1;
    idx++;
    setTimeout(runNext,350);
  },1500);
}

function finishDemo() {
  clearInterval(streamTimer); clearTimeout(dotTimer);
  document.getElementById('progPct').textContent='100%';
  document.getElementById('progBar').style.width='100%';
  document.getElementById('progText').textContent=`COMPLETE ${total} / ${total}`;
  document.getElementById('scanBeam').style.animationPlayState='paused';
  document.getElementById('detectDots').innerHTML='';
  document.getElementById('ocrStream').textContent='── 所有單據辨識完成 ──';
  document.getElementById('scanTitle').textContent='辨識完成';
  document.getElementById('scanSub').textContent=`共完成 ${total} 張，請確認資料後批次建立`;
  document.getElementById('scanFile').textContent='✅ 點擊「全部建立訂單」完成作業';
  document.getElementById('completeBadge').style.display='block';
  setTimeout(()=>stopDemo(), 3500);
}

function stopDemo() {
  clearTimeout(timer); clearInterval(streamTimer); clearTimeout(dotTimer);
  document.getElementById('aiScanOverlay').style.display='none';
  document.getElementById('progBar').style.width='0%';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- V39.34: 靜態外殼頁無 Cache-Control，瀏覽器可能吃到改版前的舊快取，加上禁快取避免每次改版都要清快取 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>鈦傳速｜分析中心</title>
  <!-- 分析中心外殼：與 OS.html 同構，讓「報表」留在 bigt.cc 網域，不跳到 script.google.com -->
  <link rel="icon" type="image/svg+xml" href="favicon-os.svg">
  <link rel="apple-touch-icon" href="favicon-os.svg">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
    }
    iframe {
      width: 100%;
      height: calc(100% + 55px);
      margin-top: -55px;
      border: none;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbz3DuFG6dOC5O0aXQ-7Ng6SOH-Su3MYQe7iVid5OuMFCKTDQ70ecxzror78asPHfiyUTw/exec?p=analytics" allow="geolocation; microphone; camera"></iframe>
  <!-- V43.0～43.9 登入中繼：iframe 裡的系統頁面請求登入 → 這裡顯示「用 LINE 登入」與 Google 登入按鈕
       （Google、LINE 都只允許登記過的網站 bigt.cc 使用）→ 把簽發的身分證明只回傳給發出請求的系統頁面，由系統後端驗證。
       LINE 用整頁跳轉 (LIFF)；Google 一般用彈出視窗，手機主畫面全螢幕 App 模式改整頁跳轉 (glogin.php)。
       LINE / FB / IG 內建瀏覽器 Google 禁止登入，只顯示 LINE 登入。 -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
  (function () {
    var CLIENT_ID = '488092523611-2012hnf14cch4s7p6sl3dp37dvihjsdm.apps.googleusercontent.com';
    var LOGIN_URI = 'https://bigt.cc/tts/glogin.php';
    var LIFF_ID = '2007666611-s3AKUd3F';
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    var ua = navigator.userAgent || '';
    var inApp = /\bLine\//i.test(ua) ? 'line' : (/FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|KAKAOTALK|musical_ly|Bytedance/i.test(ua) ? 'other' : '');
    var waiting = [], inited = false, pending = null, pendingErr = false, autoServed = false;
    var VAULT_KEYS = /^(titan_driver_token|titan_driver_name|titan_driver_car|titan_vinfo_cache|v11_car|ttsAdminTokenV41|ttsWhPersonTokenV43)$/, vaultReloaded = false;

    /* Google 整頁跳轉回來：取出登入結果並立刻從網址清掉 */
    var m = /[#&]gcred=([A-Za-z0-9_\-.]+)/.exec(location.hash);
    if (m) pending = { credential: m[1], provider: 'google' };
    if (/[#&]gerr=1/.test(location.hash)) pendingErr = true;
    if (m || pendingErr) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } }
    try { var sg = sessionStorage.getItem('tts_gcred'); if (sg && !pending) { pending = { credential: sg, provider: 'google' }; } sessionStorage.removeItem('tts_gcred'); } catch (e) { }

    /* LINE：初始化 LIFF；如果是按了「用 LINE 登入」跳轉回來的，就取出 LINE 的身分證明 */
    var liffReady = (window.liff ? liff.init({ liffId: LIFF_ID }) : Promise.reject(new Error('LIFF 載入失敗'))).then(function () {
      var want = false; try { want = sessionStorage.getItem('tts_line_pending') === '1'; sessionStorage.removeItem('tts_line_pending'); } catch (e) { }
      if (want && liff.isLoggedIn()) { var t = liff.getIDToken(); if (t) pending = { credential: t, provider: 'line' }; }
      if (/[?&](code|liffClientId|liff\.state)=/.test(location.search)) {
        var q = new URLSearchParams(location.search);
        ['code', 'state', 'liffClientId', 'liffRedirectUri', 'liff.state'].forEach(function (k) { q.delete(k); });
        try { history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString() : '')); } catch (e) { }
      }
    });
    liffReady.catch(function () { });
    setTimeout(function () { pending = null; }, 30 * 60 * 1000);

    function okOrigin(o) { return /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(o); }
    function send(msg) {
      waiting.forEach(function (w) { try { w.src.postMessage(msg, w.origin); } catch (e) { } });
      waiting = [];
      var el = document.getElementById('ttsGsi'); if (el) el.style.display = 'none';
    }
    function lineLogin() {
      var btn = document.getElementById('ttsLineBtn'); if (btn) btn.textContent = 'LINE 登入中…';
      liffReady.then(function () {
        if (liff.isLoggedIn()) {
          var dec = liff.getDecodedIDToken(), t = liff.getIDToken();
          if (t && dec && dec.exp * 1000 > Date.now() + 60000) { send({ type: 'tts-google-credential', credential: t, provider: 'line' }); return; }
          liff.logout();
        }
        try { sessionStorage.setItem('tts_line_pending', '1'); } catch (e) { }
        liff.login({ redirectUri: location.href.split('#')[0] });
      }).catch(function (e) {
        if (btn) btn.textContent = 'LINE 登入失敗，請再試一次';
      });
    }
    function renderGoogle() {
      if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(renderGoogle, 200); return; }
      if (!inited) {
        var cfg = { client_id: CLIENT_ID, auto_select: false, itp_support: true };
        if (standalone) {
          cfg.ux_mode = 'redirect'; cfg.login_uri = LOGIN_URI;
          document.cookie = 'tts_login_return=' + encodeURIComponent(location.pathname + location.search) + '; path=/tts; max-age=900; SameSite=Lax; Secure';
          try { localStorage.setItem('tts_login_return', JSON.stringify({ p: location.pathname + location.search, t: Date.now() })); } catch (e) { } /* iPhone 主畫面 App 常弄丟 cookie，另存一份 */
        } else {
          cfg.ux_mode = 'popup';
          cfg.callback = function (r) { if (r && r.credential) send({ type: 'tts-google-credential', credential: r.credential, provider: 'google' }); };
        }
        google.accounts.id.initialize(cfg);
        inited = true;
      }
      var box = document.getElementById('ttsGsiBtn'); if (!box) return; box.innerHTML = '';
      google.accounts.id.renderButton(box, { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', locale: 'zh-TW', width: 280 });
    }
    function show() {
      var el = document.getElementById('ttsGsi');
      if (!el) {
        el = document.createElement('div'); el.id = 'ttsGsi';
        el.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(2,6,23,.94);display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Noto Sans TC",sans-serif';
        var gHtml = inApp ? ''
          : '<div style="margin:16px 0 10px;color:#64748b;font-size:12px">或</div><div id="ttsGsiBtn" style="display:flex;justify-content:center;min-height:44px"></div>';
        el.innerHTML = '<div style="background:#0f172a;border:1px solid #334155;border-radius:18px;padding:26px 22px;width:100%;max-width:360px;text-align:center;color:#e2e8f0">'
          + '<div style="font-size:19px;font-weight:800;margin-bottom:6px">登入鈦傳速系統</div>'
          + '<div style="font-size:13px;color:#94a3b8;margin-bottom:18px">請用你登記在系統的帳號登入</div>'
          + '<button id="ttsLineBtn" type="button" style="width:280px;max-width:100%;padding:12px;border:0;border-radius:999px;background:#06C755;color:#fff;font-size:16px;font-weight:800;cursor:pointer">用 LINE 登入</button>'
          + gHtml
          + '<button id="ttsGsiCancel" type="button" style="margin-top:18px;width:100%;padding:11px;border-radius:10px;border:1px solid #475569;background:transparent;color:#94a3b8;font-size:15px">取消</button></div>';
        document.body.appendChild(el);
        document.getElementById('ttsLineBtn').onclick = lineLogin;
        document.getElementById('ttsGsiCancel').onclick = function () { send({ type: 'tts-google-cancel' }); };
      }
      el.style.display = 'flex';
      var lb = document.getElementById('ttsLineBtn'); if (lb) lb.textContent = '用 LINE 登入';
      if (!inApp) renderGoogle();
    }
    window.addEventListener('message', function (ev) {
      if (!okOrigin(ev.origin)) return;
      var d = ev.data || {};
      /* V43.22 登入資料保管：iPhone 主畫面 App／LINE 會清掉 iframe 的儲存，這裡 (bigt.cc 第一方) 不會 → 關掉 App 再開不用重登 */
      if (d.type === 'tts-vault-get') { var vo = {}; try { for (var vi = 0; vi < localStorage.length; vi++) { var vk = localStorage.key(vi); if (vk && vk.indexOf('ttsv_') === 0) vo[vk.slice(5)] = localStorage.getItem(vk); } } catch (e) { } try { ev.source.postMessage({ type: 'tts-vault', data: vo }, ev.origin); } catch (e) { } return; }
      if (d.type === 'tts-vault-set') { if (VAULT_KEYS.test(String(d.k)) && typeof d.v === 'string' && d.v.length < 300000) { try { localStorage.setItem('ttsv_' + d.k, d.v); } catch (e) { } } return; }
      if (d.type === 'tts-vault-del') { if (VAULT_KEYS.test(String(d.k))) { try { localStorage.removeItem('ttsv_' + d.k); } catch (e) { } } return; }
      if (d.type === 'tts-vault-reload') { if (!vaultReloaded) { vaultReloaded = true; var vf = document.querySelector('iframe'); if (vf) vf.src = vf.src; } return; }
      if (d.type === 'tts-google-pending') {
        /* 系統頁面載入時來問：剛才整頁跳轉 (LINE / Google) 有沒有帶回登入結果 */
        var src = ev.source, origin = ev.origin;
        liffReady.catch(function () { }).then(function () {
          var reply = pending ? { type: 'tts-google-credential', credential: pending.credential, provider: pending.provider } : { type: pendingErr ? 'tts-google-failed' : 'tts-google-none' };
          pending = null; pendingErr = false;
          try { src.postMessage(reply, origin); } catch (e) { }
        });
        return;
      }
      if (d.type === 'tts-line-auto') {
        /* V43.12: 在 LINE 裡、頁面還沒登入 → 自動用 LINE 登入。LINE 已記得登入就直接回傳；
           否則自動跳轉 LINE 登入一次 (同一次瀏覽只自動跳一次，避免取消後一直重跳) */
        if (inApp !== 'line' || autoServed) return;
        var asrc = ev.source, aorigin = ev.origin;
        liffReady.then(function () {
          if (autoServed) return;
          if (liff.isLoggedIn()) {
            var dec = liff.getDecodedIDToken(), t = liff.getIDToken();
            if (t && dec && dec.exp * 1000 > Date.now() + 60000) { autoServed = true; try { asrc.postMessage({ type: 'tts-google-credential', credential: t, provider: 'line' }, aorigin); } catch (e) { } return; }
            liff.logout();
          }
          var tried = false; try { tried = sessionStorage.getItem('tts_line_auto_tried') === '1'; } catch (e) { }
          if (tried) return;
          autoServed = true;
          try { sessionStorage.setItem('tts_line_auto_tried', '1'); sessionStorage.setItem('tts_line_pending', '1'); } catch (e) { }
          liff.login({ redirectUri: location.href.split('#')[0] });
        }).catch(function () { });
        return;
      }
      if (d.type !== 'tts-google-login') return;
      waiting.push({ src: ev.source, origin: ev.origin });
      try { ev.source.postMessage({ type: 'tts-google-ack' }, ev.origin); } catch (e) { }
      show();
    });
  })();
  </script>
</body>
</html>

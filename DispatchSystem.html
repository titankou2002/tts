<!-- 
  🚚 派車工作站 V8.5 【UI & LOGIC 永久規範 - 嚴禁亂改】
  1. 卡片格式：2行制。
     - L1: [客戶] [A/E/S/W] (退)紅字 [地址] [司機車牌]
     - L2: [回鶯歌Btn] [尺寸] [箱數] [重量(放大樣式)] [待指派標] [時間] [日期]
  2. 載重邏輯：動態扣除「已完成/已送達/結案」之重量。
  3. 顏色規範：重量 <200(灰), 200-500(綠), 500-1000(黃), >1000(紅)
  4. 標題鎖定：司機分配載重
-->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --color-bg-deep: #020617; --color-bg-card: #0f172a; --color-primary: #38bdf8;
            --color-accent: #fbbf24; --color-danger: #ef4444; --color-success: #22c55e;
            --color-pink: #f472b6; --color-blue: #3b82f6; --color-gray: #94a3b8;
        }
        body { margin: 0; font-family: "Microsoft JhengHei", sans-serif; background: var(--color-bg-deep); font-size: 13px; color: #fff; overflow: hidden; }
        
        /* 📋 格式記憶鎖定：嚴格兩行 */
        .task-card {
            padding: 6px 12px; background: var(--color-bg-card); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; cursor: pointer; position: relative; display: flex; flex-direction: column; gap: 4px; border-left: 4px solid #1e293b;
            transition: all 0.2s;
        }
        .task-card:hover { border-color: var(--color-primary); background: #1e293b; }
        .task-card.is-assigned { opacity: 0.55; filter: grayscale(0.2); }
        .task-card.selected { border-width: 2px; border-color: var(--color-primary); background: rgba(56,189,248,0.1); opacity: 1 !important; }
        .task-card.same-address { border-left-color: var(--color-danger) !important; }
        
        /* 🟡 同地址群組樣式 */
        .address-group {
            border: 2px solid #fbbf24;
            border-radius: 10px;
            padding: 6px;
            background: rgba(251, 191, 36, 0.05);
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .address-group-header {
            color: #fbbf24;
            font-weight: 900;
            font-size: 12px;
            padding: 2px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .addr-return {
            background: var(--color-danger) !important;
            color: #fff !important;
            padding: 2px 6px !important;
            border-radius: 4px;
            font-weight: 900;
        }
        
        .badge-size { color: #3b82f6; font-size: 14px; font-weight: 900; padding: 0; }
        .time-tag { background: var(--color-accent); color: #000; padding: 1px 5px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        
        .branch-badge { padding: 1px 4px; border-radius: 4px; color: #fff; font-weight: 900; font-size: 10px; white-space: nowrap; text-align: center; min-width: 20px; }
        .br-a { background: var(--color-success); border: 1px solid rgba(255,255,255,0.3); } .br-e { background: var(--color-pink); border: 1px solid rgba(255,255,255,0.3); }
        .br-s { background: var(--color-blue); border: 1px solid rgba(255,255,255,0.3); } .br-w { background: var(--color-accent); color: #000; border: 1px solid rgba(0,0,0,0.1); }

        /* 回鶯歌按鈕 */
        .btn-yingge { background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 900; cursor: pointer; }
        .btn-yingge.active { background: #fbbf24; color: #000; border-color: #fbbf24; }

        .driver-name-tag { font-weight: 900; color: #fff; background: var(--color-primary); padding: 1px 8px; border-radius: 4px; font-size: 12px; }
        .unassigned-badge { background: var(--color-danger); color: #fff; padding: 1px 8px; border-radius: 4px; font-size: 11px; font-weight: 900; }

        .driver-weight-card { padding: 10px; background: #1e293b; border: 2px solid #334155; border-radius: 8px; min-width: 145px; }
        .load-bar-bg { width: 100%; height: 8px; background: #000; border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .load-bar-fill { height: 100%; transition: width 0.4s; }

        .cust-name { color: #60a5fa; font-weight: 900; font-size: 15px; }
        .return-text { color: var(--color-danger); font-weight: 900; font-size: 13px; margin: 0 4px; }
        .addr-text { color: #cbd5e1; font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px; }

        .external-sub-row { flex: 1; padding: 4px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .external-sub-row:last-child { border-bottom: none; }
        .external-sub-row:hover { background: rgba(168, 85, 247, 0.2); }
        .external-sub-row b { color: #d8b4fe; font-size: 13px; }

        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .btn-return-trigger:hover { transform: scale(1.1); background: #9333ea !important; }
        
        /* V11.20: 退回狀態卡片樣式 */
        .task-card.is-returned {
            background: #a855f7 !important;
            border-color: #d8b4fe !important;
            color: #fff !important;
        }
        .task-card.is-returned .card-address, 
        .task-card.is-returned .card-specs,
        .task-card.is-returned .addr-text {
            color: #fff !important;
            opacity: 0.9;
        }

        .return-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 1000003; display: flex; align-items: center; justify-content: center;
        }
        .return-modal-content {
            background: #1e293b; width: 500px; border-radius: 15px; border: 3px solid #a855f7; padding: 25px;
            display: flex; flex-direction: column; gap: 15px; max-height: 90vh;
        }
        @keyframes pulse-light {
            0% { box-shadow: 0 0 0px rgba(245,158,11,0.4); }
            50% { box-shadow: 0 0 15px rgba(245,158,11,0.7); }
            100% { box-shadow: 0 0 0px rgba(245,158,11,0.4); }
        }

        /* 轉址內嵌 iframe 時自動向下微調，防止被 negative margin 推移剪裁 */
        body.embedded-iframe #dispatchModal {
            top: 55px !important;
            height: calc(100vh - 55px) !important;
        @keyframes pulse-click {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1); }
        }
        .btn-pulse:active {
            animation: pulse-click 0.2s ease-out;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="dispatchModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:var(--color-bg-deep); z-index:9000; flex-direction:column; overflow:hidden;">
        <!-- Header -->
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 25px; background:#1e293b; border-bottom:3px solid var(--color-primary); flex-shrink: 0;">
            <div style="color:#fff; font-weight:900; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-right:10px;">物流派車工作站 V8.8</div>
            <div style="display:flex; gap:12px;">
                <button id="batchReturnBtn" class="btn-pulse" onclick="openReturnModalFromSelection()" style="display:none; background:#a855f7; color:#fff; border:none; padding:8px 18px; border-radius:8px; font-weight:900; cursor:pointer;">🔴 批次退回分公司</button>
                <button id="copyToLINEBtn" class="btn-pulse" onclick="copyToLINE()" style="background:var(--color-success); color:#fff; border:none; padding:8px 18px; border-radius:8px; font-weight:900; cursor:pointer;">已勾選清單</button>
                <button id="copyToWarehouseBtn" class="btn-pulse" onclick="copyToWarehouse()" style="background:var(--color-accent); color:#000; border:none; padding:8px 18px; border-radius:8px; font-weight:900; cursor:pointer;">📸 回鶯歌圖片</button>
                <button onclick="closeDispatchModal()" style="background:#475569; color:#fff; border:none; padding:8px 18px; border-radius:8px; cursor:pointer; font-weight:900;">✕ 關閉</button>
            </div>
        </div>

        <div style="flex:1; display:flex; overflow:hidden;">
            <!-- 清單區 (V11.21: 加寬至 750px 避免折字) -->
            <div style="width:750px; border-right:2px solid #1e293b; display:flex; flex-direction:column; background:#0f172a;">
                <div style="padding:10px; background:#1e293b; display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <select id="filterDate" onchange="applyFilters_V3()" style="background:#020617; color:#fff; border:1px solid #475569; padding:6px; border-radius:6px;"></select>
                    <select id="sortMode" onchange="applyFilters_V3()" style="background:#020617; color:#fff; border:1px solid #475569; padding:6px; border-radius:6px;">
                        <option value="address" selected>📍 依收貨地址排序</option>
                        <option value="driver">👤 依司機排序</option>
                        <option value="time">⏰ 依送貨時間排序</option>
                        <option value="customer">👤 依客戶名稱排序</option>
                    </select>
                    <select id="filterBranch" onchange="applyFilters_V3()" style="background:#020617; color:#fff; border:1px solid #475569; padding:6px; border-radius:6px;">
                        <option value="all">🏢 所有公司</option>
                        <option value="安帝嘉">A</option><option value="漢樺">W</option><option value="高雅瓷">E</option><option value="喜悅納">S</option>
                    </select>
                    <select id="filterDriver" onchange="applyFilters_V3()" style="background:#020617; color:#fff; border:1px solid #475569; padding:6px; border-radius:6px;">
                        <option value="all">🔍 所有指派狀態</option>
                        <option value="unassigned">🔴 待指派訂單</option>
                    </select>
                    <div style="grid-column: span 2;">
                        <input type="text" id="searchQuery" oninput="applyFilters_V3()" placeholder="🔍 搜尋客戶、地址、單號..." style="width:100%; background:#020617; color:#fff; border:1px solid #475569; padding:8px; border-radius:6px;">
                    </div>
                </div>
                <div id="filterStats" style="padding:7px 12px; background:#0f172a; color:#cbd5e1; font-size:13px; font-weight:bold; border-bottom:1px solid #1e293b;"></div>
                <div id="unifiedTaskList" class="custom-scroll" style="flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px;"></div>
            </div>

            <!-- 右側板 -->
            <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
                <div style="flex:1; background:#000; margin:10px; border-radius:15px; display:flex; justify-content:center; align-items:center; border:2px solid #334155; overflow: hidden; position:relative;">
                    <img id="dispatchVoucherImg" style="display:none; max-width:100%; max-height:100%; object-fit: contain;">
                    <div id="dispatchVoucherPlaceholder" style="color:#475569; font-size:16px;">🔍 點擊左側卡片預覽圖檔</div>
                </div>
                <!-- 司機分配載重 -->
                <div style="height: 160px; padding:12px 20px; background:#1e293b; border-top:3px solid var(--color-primary); flex-shrink:0;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
                        <span style="color:var(--color-primary); font-size:15px; font-weight:900;">🚛 司機分配載重</span>
                        <div style="color:var(--color-gray); font-size:12px; display:flex; align-items:center; gap:10px;">
                            <span>已選: <span id="dispatchSelectedCount" style="color:var(--color-accent); font-weight:900;">0</span> 筆 | 共計 <span id="selWeightTotal" style="color:var(--color-success); font-weight:900;">0</span> kg</span>
                        </div>
                    </div>
                    <div id="driverLoadDashboard" class="custom-scroll" style="display:flex; gap:12px; overflow-x:auto; padding-bottom:8px;"></div>
                </div>
            </div>
        </div>
        </div>
    </div>

    <!-- V11.20: 退回確認視窗 (多原因支援版) -->
    <div id="returnConfirmModal" class="return-modal-overlay" style="display:none;">
        <div class="return-modal-content" style="width: 550px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="color:#a855f7; margin:0;">🔴 批次退回分公司</h3>
                <div style="font-size:12px; color:#94a3b8;">
                    快速套用：
                    <select id="globalReasonSelect" onchange="applyGlobalReason()" style="background:#0f172a; color:#fff; border:1px solid #475569; padding:2px 5px; border-radius:4px; font-size:11px;">
                        <option value="">-- 選擇原因 --</option>
                        <option value="路線不順">路線不順</option>
                        <option value="重量過重">重量過重</option>
                        <option value="業務送比較方便">業務送比較方便</option>
                        <option value="時間不合">時間不合</option>
                    </select>
                </div>
            </div>

            <div id="returnItemsList" class="custom-scroll" style="flex:1; overflow-y:auto; border:1px solid #334155; border-radius:8px; background:#0f172a; padding:5px;">
                <!-- 這裡會由 JS 動態生成條列式清單 -->
            </div>
            
            <div style="background:rgba(168, 85, 247, 0.1); border:1px dashed #a855f7; border-radius:8px; padding:10px;">
                <label style="color:#a855f7; font-size:11px; font-weight:900;">LINE 通知預覽：</label>
                <div id="linePreviewText" style="color:#cbd5e1; font-size:12px; white-space:pre-wrap; margin-top:5px; font-family:monospace; max-height:100px; overflow-y:auto;" class="custom-scroll"></div>
            </div>

            <div style="display:flex; gap:12px;">
                <button id="execReturnBtn" onclick="executeBatchReturn()" style="flex:1.5; background:#a855f7; color:#fff; padding:12px; border:none; border-radius:10px; font-weight:900; cursor:pointer; transition: transform 0.1s, background 0.2s;" onmousedown="this.style.transform='scale(0.95)'; this.style.background='#9333ea'" onmouseup="this.style.transform='scale(1)'; this.style.background='#a855f7'">🚀 確認退回並發送 LINE</button>
                <button onclick="closeReturnModal()" style="flex:1; background:#475569; color:#fff; padding:12px; border:none; border-radius:10px; font-weight:900; cursor:pointer;">取消</button>
            </div>
        </div>
    </div>

    <!-- 圖片預覽彈窗 -->
    <div id="imagePreviewModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100001; flex-direction:column; align-items:center; justify-content:center;">
        <div style="background:#1e293b; padding:20px; border-radius:12px; border:2px solid #38bdf8; max-width:90%;">
            <div class="custom-scroll" style="max-height:70vh; overflow-y:auto; background:#000; border-radius:10px; position: relative; border: 1px solid #334155;">
                <img id="previewImg" style="width:100%; max-width:450px; height:auto; display: block; cursor: pointer; margin: 0 auto;" title="請點擊上方按鈕開啟新分頁複製，或直接對此圖點右鍵複製">
                <div id="copyManualHint" style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fbbf24; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; pointer-events: none;">轉址版限制：請「點上方按鈕」或對圖「點右鍵」複製</div>
            </div>
            <div style="display:flex; gap:15px; margin-top:20px;">
                <button id="finalOpenBtn" class="btn-pulse" style="flex:2; background:var(--color-success); color:#fff; padding:15px; border:none; border-radius:8px; font-weight:900; cursor:pointer; font-size:18px; display: flex; align-items: center; justify-content: center; gap: 8px;">📋 點我複製 (開啟新分頁)</button>
                <button id="finalDownloadBtn" class="btn-pulse" style="flex:1; background:#334155; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px;">💾 下載圖片</button>
                <button onclick="document.getElementById('imagePreviewModal').style.display='none'" style="width:80px; background:#1e293b; color:#94a3b8; border:1px solid #334155; border-radius:8px; cursor:pointer;">返回</button>
            </div>
        </div>
    </div>

    <!-- V12.3 FIX: 絕不能用 opacity:0，否則畫布引擎會略過渲染！改用極限 z-index 藏在最底層 -->
    <div id="lineShareTemplate" style="position:fixed; left:0; top:0; background:#0f172a; padding:15px; z-index:-99999; opacity:1; pointer-events:none; visibility: visible; display: none;"></div>

<script>

    let dispatchAllTasks = [];
    let dispatchSelectedIds = new Set();
    let dispatchDrivers = [];
    let pendingReturnSet = new Set(); // V11.20: 暫存待退回單號

    // V8.5.1: 新增日期格式化工具
    const formatDate = (d) => `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;

    function scrubAddress(a) {
        if (!a) return "";
        let str = String(a);
        if (str.startsWith('基隆市')) {
            str = str.replace(/[\u4e00-\u9fff]{2}區/, '');
        } else {
            str = str.replace(/^(台北市|臺北市|新北市|桃園市|基隆市|[\u4e00-\u9fff]{2,3}[縣市])/g, '');
        }
        return str.replace(/(號)([\s,，-].*)$/, '$1').replace(/(\d+)(樓|F|層|號-.*)$/i, '$1號').trim();
    }

    function getWeightColor(w) {
        if (w >= 1000) return "#ef4444";
        if (w >= 500) return "#fbbf24";
        if (w >= 200) return "#22c55e";
        return "#94a3b8";
    }

    const brMap = {
        '安帝嘉': { label: 'A', s: 'A', c: 'br-a', color: '#22c55e', tx: '#fff' },
        '漢樺':   { label: 'W', s: 'W', c: 'br-w', color: '#fbbf24', tx: '#000' },
        '高雅瓷': { label: 'E', s: 'E', c: 'br-e', color: '#f472b6', tx: '#fff' },
        '喜悅納': { label: 'S', s: 'S', c: 'br-s', color: '#3b82f6', tx: '#fff' }
    };

    const orderSuffixMap = {
        '安帝嘉': '安',
        '漢樺': '漢',
        '高雅瓷': '高',
        '喜悅納': '喜',
        'A': '安',
        'W': '漢',
        'E': '高',
        'S': '喜'
    };

    function getOrderSuffix(value) {
        const raw = String(value || '').trim();
        if (!raw) return '';
        return orderSuffixMap[raw] || raw.charAt(0) || '';
    }

    function formatDisplayOrderId(orderId, branch) {
        const raw = String(orderId || '').trim();
        if (!raw) return '';
        const match = raw.match(/^(.+?)-(.+)$/);
        if (match) {
            const main = match[1].trim();
            const suffix = getOrderSuffix(match[2]) || getOrderSuffix(branch);
            return suffix ? `${main}-${suffix}` : main;
        }
        const suffix = getOrderSuffix(branch);
        return suffix ? `${raw}-${suffix}` : raw;
    }

    function getOrderTint(orderId, branch) {
        const suffix = formatDisplayOrderId(orderId, branch).split('-').pop();
        return ({
            '安': { color: '#22c55e', textColor: '#fff' },
            '漢': { color: '#fbbf24', textColor: '#000' },
            '高': { color: '#f472b6', textColor: '#fff' },
            '喜': { color: '#3b82f6', textColor: '#fff' }
        })[suffix] || { color: '#64748b', textColor: '#fff' };
    }

    function formatItemQtyBox(qty, boxQty, pcsPerBox) {
        const rawQty = String(qty || '').trim();
        if (!rawQty) return '';
        const pieces = Number(rawQty.replace(/,/g, '').match(/[\d.]+/)?.[0] || 0);
        const perBox = Number(String(pcsPerBox || '').replace(/,/g, '').match(/[\d.]+/)?.[0] || 0);
        const colorNum = (value, color) => `<span style="color:${color};font-weight:950;font-size:1.12em;line-height:1;">${escapeHTML(value)}</span>`;
        const unit = value => `<span style="color:#94a3b8;font-weight:800;">${escapeHTML(value)}</span>`;
        const perBoxNum = value => `<span style="color:#cbd5e1;font-weight:900;">${escapeHTML(value)}</span>`;
        if (!pieces || !perBox) {
            const label = /[片箱包件]/.test(rawQty) ? rawQty : rawQty + '片';
            return colorNum(label.replace(/[^\d.]/g, '') || label, '#fbbf24') + unit(label.replace(/[\d.]/g, ''));
        }
        const fullBoxes = Math.floor(pieces / perBox);
        const loosePieces = Math.round((pieces - fullBoxes * perBox) * 100) / 100;
        const parts = [];
        if (fullBoxes) parts.push(colorNum(fullBoxes, '#38bdf8') + unit('箱*') + perBoxNum(perBox) + unit('片'));
        if (loosePieces) parts.push(colorNum(loosePieces, '#fb7185') + unit('片'));
        return parts.join(unit('+')) || (colorNum(pieces, '#fbbf24') + unit('片'));
    }

    function formatItemWeight(weight) {
        const num = Number(weight || 0);
        if (!num) return '';
        const rounded = Math.round(num);
        return (rounded > 0 ? rounded : 1) + 'kg';
    }

    const driverPalette = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6", "#ec4899", "#06b6d4", "#f97316"];

    const DRIVER_COLORS = {
        '李易璋': { bg: '#fbcfe8', tx: '#000' },
        '喜悅納': { bg: '#93c5fd', tx: '#000' },
        '恐龍':   { bg: '#86efac', tx: '#000' },
        '簡紹軒': { bg: '#c084fc', tx: '#000' }
    };

    function getDriverColor(name) {
        if (!name) return "var(--color-primary)";
        const n = name.trim();
        if (DRIVER_COLORS[n]) return DRIVER_COLORS[n].bg;
        if (name.includes("外派") || name.includes("外車")) return "#a855f7"; 
        
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        return driverPalette[Math.abs(hash) % driverPalette.length];
    }

    function getDriverTextColor(name) {
        if (!name) return "#fff";
        const n = name.trim();
        if (DRIVER_COLORS[n]) return DRIVER_COLORS[n].tx;
        return "#fff";
    }

    function isTouchDevice() {
        return (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) ||
            window.matchMedia('(pointer: coarse)').matches ||
            /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function openDispatchModal_V3() {
        document.getElementById('dispatchModal').style.display = 'flex';
        google.script.run.withSuccessHandler(res => {
            if (res.success) {
                dispatchAllTasks = res.tasks;
                populateFilters();
                google.script.run.withSuccessHandler(dRes => {
                    if (dRes.success) {
                        dispatchDrivers = dRes.drivers || [];
                        updateDriverFilter();
                        renderDriverDashboard_V7();
                        applyFilters_V3();
                    }
                }).getDrivers_V3();
            }
        }).getUnDispatchedTasks_V3();
    }

    function closeDispatchModal() {
        document.getElementById('dispatchModal').style.display = 'none';
    }

    function toggleItemsDropdown(event, id, contentPrefix = 'items-', arrowPrefix = 'arrow-') {
        event.stopPropagation();
        const el = document.getElementById(contentPrefix + id);
        const arrow = document.getElementById(arrowPrefix + id);
        if (!el) return;
        if (el.style.display === 'none') {
            el.style.display = 'block';
            if (arrow) arrow.style.transform = 'rotate(180deg)';
        } else {
            el.style.display = 'none';
            if (arrow) arrow.style.transform = 'rotate(0deg)';
        }
    }

    function populateFilters() {
        const s = document.getElementById('filterDate');
        const todayStr = formatDate(new Date());
        const d = [...new Set(dispatchAllTasks.map(t => t.date))]
            .filter(x => !x || x >= todayStr)
            .sort();
        let h = '<option value="all">📅 全部配送日期</option>';
        d.forEach(x => {
            h += `<option value="${x}">${x}</option>`;
        });
        s.innerHTML = h;
        s.value = 'all';
    }

    function updateDriverFilter() {
        const s = document.getElementById('filterDriver');
        let h = '<option value="all">🔍 所有指派狀態</option><option value="unassigned">🔴 待指派訂單</option>';
        dispatchDrivers.forEach(d => {
            h += `<option value="${d.plate}">👤 ${d.name}</option>`;
        });
        s.innerHTML = h;
    }

    function applyFilters_V3() {
        const todayStr = formatDate(new Date());
        const dv = document.getElementById('filterDate').value;
        const bv = document.getElementById('filterBranch').value;
        const prv = document.getElementById('filterDriver').value;
        const sq = document.getElementById('searchQuery').value.toLowerCase();
        
        const filtered = dispatchAllTasks.filter(t => {
            const dOk = dv === 'all' || t.date === dv;
            const futureOk = !t.date || t.date >= todayStr;
            const bOk = bv === 'all' || (t.branch || '').includes(bv);
            let pOk = true;
            if (prv === 'unassigned') pOk = !t.assignedDriver || t.assignedDriver === "";
            else if (prv !== 'all') pOk = t.assignedDriver === prv || t.vehicle === prv;
            
            const sOk = !sq || (t.customer + t.address + t.id).toLowerCase().includes(sq);
            
            // V11.20: 從主清單隱藏正處於「待退回暫存區」的訂單
            const hideOk = !pendingReturnSet.has(t.id);

            return dOk && futureOk && bOk && pOk && sOk && hideOk;
        });
        // V11.20: 顯示/隱藏批次退回按鈕
        const returnBtn = document.getElementById('batchReturnBtn');
        if(returnBtn) returnBtn.style.display = dispatchSelectedIds.size > 0 ? 'flex' : 'none';

        const assignedCnt = filtered.filter(t => (!!t.assignedDriver && t.assignedDriver !== "") || (t.status !== '待指派' && t.status !== '')).length;
        document.getElementById('filterStats').innerHTML = `🔎 篩選顯示：共 <span style="color:#38bdf8;">${filtered.length}</span> 筆 &nbsp;|&nbsp; 🟢 已分配: <span style="color:#22c55e;">${assignedCnt}</span> &nbsp;|&nbsp; 🔴 待分配: <span style="color:#ef4444;">${filtered.length - assignedCnt}</span>`;
        renderDispatchSections_V7(filtered);
        renderDriverDashboard_V7();
    }

    function renderDispatchSections_V7(tasks) {
        const c = document.getElementById('unifiedTaskList');
        const m = document.getElementById('sortMode').value;
        const norm = a => scrubAddress(a).replace(/\s/g, '').replace(/[０-９]/g, x => String.fromCharCode(x.charCodeAt(0) - 0xFEE0));
        
        // 1. 排序
        tasks.sort((a, b) => {
            const aAssigned = (!!a.assignedDriver && a.assignedDriver !== "") || (a.status !== '待指派' && a.status !== '');
            const bAssigned = (!!b.assignedDriver && b.assignedDriver !== "") || (b.status !== '待指派' && b.status !== '');
            
            // V11.20: 「退回分公司」自動下沉至底部
            const aReturned = a.status === '退回分公司';
            const bReturned = b.status === '退回分公司';
            if (aReturned !== bReturned) return aReturned ? 1 : -1;

            if (aAssigned !== bAssigned) return aAssigned ? 1 : -1;
            if (m === 'driver') {
                const da = a.assignedDriver || a.vehicle || 'ZZZ';
                const db = b.assignedDriver || b.vehicle || 'ZZZ';
                return da.localeCompare(db, 'zh-TW');
            }
            if (m === 'time') return (a.timeSlot || 'ZZZ').localeCompare(b.timeSlot || 'ZZZ', 'zh-TW');
            if (m === 'customer') return a.customer.localeCompare(b.customer, 'zh-TW');
            return norm(a.address).localeCompare(norm(b.address), 'zh-TW');
        });

        // 2. 預計算地址分組與精確重複
        const groupCounts = {};
        const exactDupCounts = {};
        tasks.forEach(t => {
            const addrK = norm(t.address);
            groupCounts[addrK] = (groupCounts[addrK] || 0) + 1;
            const exactK = addrK + '_' + (t.size || '') + '_' + (t.boxes || '') + '_' + (t.branch || '');
            exactDupCounts[exactK] = (exactDupCounts[exactK] || 0) + 1;
        });

        // 3. 分組渲染
        let html = '';
        let i = 0;
        while (i < tasks.length) {
            const t = tasks[i];
            // V15.5: 智慧同址辨識核心
            const getSmartKeys = a => {
                if(!a) return [];
                let s = scrubAddress(a).replace(/\s/g, '').replace(/[０-９]/g, x => String.fromCharCode(x.charCodeAt(0) - 0xFEE0));
                let ks = [s];
                let m = a.match(/\(([^)]+)\)/);
                if(m) {
                    let al = m[1].replace(/\s/g, '').replace(/(貨運|有限公司|公司|設計|建材|磁磚|工程|工作室)/g, '');
                    if(al.length >= 2) ks.push(al);
                }
                if(s.length < 10) {
                    let sh = s.replace(/(貨運|有限公司|公司|設計|建材|磁磚|工程|工作室)/g, '');
                    if(sh.length >= 2) ks.push(sh);
                }
                return ks;
            };

            const tDate = t.date;
            const tKeys = getSmartKeys(t.address);
            
            const allMatchingAtAddr = dispatchAllTasks.filter(at => {
                const isFinished = (at.status && (at.status.includes('完成') || at.status.includes('送達') || at.status.includes('結案')));
                if(isFinished || at.date !== tDate) return false;
                const atKeys = getSmartKeys(at.address);
                return tKeys.some(k1 => atKeys.some(k2 => k1 === k2));
            });

            // 找出連續相同地址(智慧匹配)的數量
            let groupSize = 1;
            while (i + groupSize < tasks.length) {
                const nextKeys = getSmartKeys(tasks[i+groupSize].address);
                if(tKeys.some(k1 => nextKeys.some(k2 => k1 === k2))) {
                    groupSize++;
                } else {
                    break;
                }
            }
            
            const groupTasks = tasks.slice(i, i + groupSize);
            const isGroup = groupSize > 1;

            const hasUnassignedAtAddr = allMatchingAtAddr.some(at => !at.vehicle);
            const hasOtherDriversAtAddr = allMatchingAtAddr.some(at => at.vehicle && at.vehicle !== groupTasks[0].vehicle);
            const missingFromView = allMatchingAtAddr.some(at => !groupTasks.find(gt => gt.id === at.id));
            
            const totalAtAddr = allMatchingAtAddr.length;
            const infoMsg = ''; // V15.6: 根據要求隱藏紅色 Banner
            
            const addrK = tKeys[0];
            // 檢查該組的勾選狀態
            const selectedInGroup = groupTasks.filter(gt => dispatchSelectedIds.has(gt.id));
            const isPartiallySelected = selectedInGroup.length > 0 && selectedInGroup.length < groupSize;
            
            let groupInnerHtml = groupTasks.map((gt, gIdx) => {
                const globalIdx = i + gIdx + 1;
                const isAssigned = (!!gt.assignedDriver && gt.assignedDriver !== "") || (gt.status !== '待指派' && gt.status !== '');
                const isS = dispatchSelectedIds.has(gt.id);
                const exactK = addrK + '_' + (gt.size || '') + '_' + (gt.boxes || '') + '_' + (gt.branch || '');
                const isExactDuplicate = exactDupCounts[exactK] > 1;
                
                const displayId = formatDisplayOrderId(gt.id, gt.branch);
                const brObj = getOrderTint(gt.id, gt.branch);
                
                const custShort2 = (function () {
                    var raw = String(gt.customer || '');
                    var cleaned = raw.replace(/(股份有限公司|有限公司|實業|設計|建材|工程|工作室|公司|商行|企業|磁磚|五金)/g, '').trim();
                    return cleaned.length > 0 ? cleaned.substring(0, 2) : raw.substring(0, 2);
                })();

                return `
                    <div class="task-card ${isS ? 'selected' : ''} ${isExactDuplicate ? 'same-address' : ''} ${isAssigned ? 'is-assigned' : ''} ${gt.status === '退回分公司' ? 'is-returned' : ''}" onclick="handleCardClick_V7('${gt.id}')">
                        <div style="display:flex; align-items:center; gap:8px; flex-wrap: wrap;">
                            <span style="color:var(--color-primary); font-weight:900; min-width:20px;">${globalIdx}.</span>
                            <input type="checkbox" ${isS ? 'checked' : ''} style="width:16px; height:16px;" onclick="toggleSelectionByCheckbox(event,'${gt.id}')">
                            <b class="cust-name">${escapeHTML(custShort2)}</b>
                            ${gt.shippingType && gt.shippingType !== '送貨' ? `<span style="background:#f59e0b; color:#000; padding:2px 6px; border-radius:4px; font-size:12px; font-weight:900; box-shadow: 0 0 8px rgba(245,158,11,0.4); animation: pulse-light 2s infinite; margin-left:4px;">${gt.shippingType}</span>` : ''}
                            <!-- Colored Order ID Box -->
                            <span class="id-box-disp" style="background:${brObj.color}; color:${brObj.textColor}; padding: 2px 6px; border-radius: 4px; font-size: 13px; font-weight: 700; margin-left: 4px;">${displayId}</span>
                            <span class="addr-text ${gt.isReturn ? 'addr-return' : ''}">${escapeHTML(scrubAddress(gt.address))}</span>
                            ${(String(gt.wrapSeal || '').includes('封') || String(gt.note || '').includes('膠膜')) ? '<span class="wrap-tag" style="background:#22c55e; color:#000; padding:2px 6px; border-radius:4px; font-size:12px; font-weight:bold; margin-left:4px; box-shadow:0 0 6px rgba(34,197,94,0.4);">膠膜</span>' : ''}
                            ${isExactDuplicate ? '<span style="color:#ef4444; font-weight:900; font-size:12px; border:1px solid #ef4444; padding:2px 6px; border-radius:4px; margin-left:4px; animation: pulse-light 2s infinite;">重複異常請注意‼️</span>' : ''}
                            ${isAssigned && gt.status !== '退回分公司' ? `<span style="margin-left:auto; background:${getDriverColor(gt.assignedDriver)}; color:${getDriverTextColor(gt.assignedDriver)};" class="driver-name-tag">${escapeHTML(gt.assignedDriver)}</span>` : ''}
                        </div>
                        <div style="display:flex; align-items:center; gap:10px; margin-left:50px; margin-top:6px;">
                            <button class="btn-yingge ${gt.isBackYingge ? 'active' : ''}" onclick="toggleYinggeRemote(event,'${gt.id}',${!gt.isBackYingge})">回鶯歌</button>
                            
                            <!-- Expandable Dropdown Trigger instead of static Size/Boxes -->
                            ${gt.items && gt.items.length > 0 ? `
                            <div class="items-dropdown-trigger" onclick="toggleItemsDropdown(event, '${gt.id}')" style="background: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.4); padding: 3px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;">
                                明細 <span class="arrow-icon" id="arrow-${gt.id}" style="font-size: 10px; transition: transform 0.2s;">▼</span>
                            </div>
                            ` : ''}

                            <span style="color:${getWeightColor(gt.weight)}; font-weight:900; font-size:18px; margin-left: 8px;">${gt.weight.toFixed(0)} <span style="font-size:11px;">kg</span></span>
                            ${gt.note ? `<span class="note-line-content" style="color: #fbbf24; font-weight: bold; font-size: 13px; line-height: 1.4; word-break: break-all; margin-left:4px;">${gt.note}</span>` : ''}
                            ${(gt.whStatus === '已上車' && gt.date === formatDate(new Date())) ? `
                                <span style="color:var(--color-success); font-size:12px; margin-left:4px;" title="實載司機: ${gt.whDriver}">✅${(gt.whDriver && gt.whDriver !== gt.assignedDriver) ? `<span style="font-size:10px; opacity:0.8">(載:${gt.whDriver})</span>` : ''}</span>
                            ` : ''}
                            <div style="margin-left:auto;"></div>
                            ${!isAssigned ? `<span class="unassigned-badge">待指派</span>` : ''}
                            ${gt.timeSlot ? `<span class="time-tag">${gt.timeSlot}</span>` : ''}
                            <span style="color:#fbbf24; font-weight:900; font-size:14px; font-family:'Rajdhani';">${gt.date.substring(5)}</span>
                        </div>

                        <!-- Dropdown Content -->
                        ${gt.items && gt.items.length > 0 ? `
                        <div class="items-dropdown-content" id="items-${gt.id}" style="display:none; margin-top: 6px; margin-left: 50px; background: rgba(0,0,0,0.4); border-radius: 8px; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.05);" onclick="event.stopPropagation()">
                            ${gt.items.map((item, itemIdx) => {
                                const sizeArr = (gt.size || '').split(/[,，、；;\/]+/);
                                const itemSize = (sizeArr[itemIdx] || sizeArr[0] || '').trim();
                                const qtyBox = formatItemQtyBox(item.qty, item.boxQty, item.pcsPerBox);
                                const weightText = formatItemWeight(item.itemWeight) || (itemIdx === 0 ? formatItemWeight(gt.weight) : '');
                                return `
                                    <div class="item-detail-row" style="display:grid; grid-template-columns:minmax(90px,1fr) minmax(50px,auto) minmax(90px,auto) minmax(50px,auto) minmax(54px,auto) 50px; align-items:center; gap:8px; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.08); font-size: 14px; font-weight: bold;">
                                        <div style="display:flex; flex-direction:column; min-width:0;">
                                            <span style="color:#fff;">${item.code}</span>
                                            ${(item.series || item.originalName) ? `<span style="color:#94a3b8; font-size:11px; font-weight:400;">${item.series ? '<span style="color:#fbbf24;">' + item.series + '</span> ' : ''}${item.originalName || ''}</span>` : ''}
                                        </div>
                                        <span class="item-size" style="color:var(--color-primary); opacity:0.85; font-size:13px; white-space:nowrap;">${String(item.size || itemSize || '-').replace(/cm/gi, '')}</span>
                                        <span class="item-qty" style="color:var(--color-accent); white-space:nowrap;">${qtyBox}</span>
                                        <span class="item-total-qty" style="color:#f472b6; white-space:nowrap;">${item.qty}片</span>
                                        <span class="item-weight" style="color:var(--color-success); white-space:nowrap;">${weightText}</span>
                                        ${item.image ? '<img src="' + item.image.replace(/'/g,"\\'") + '" style="width:44px;height:44px;object-fit:cover;border-radius:4px;cursor:pointer;" onclick="event.stopPropagation();window.open(\'' + item.image.replace(/'/g,"\\'") + '\',\'_blank\')">' : '<span style="width:44px;"></span>'}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        ` : ''}
                    </div>`;
            }).join('');

            if (isGroup) {
                html += `
                    <div class="address-group">
                        <div class="address-group-header" style="flex-direction:column; align-items:stretch; gap:4px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span>📍 同地址訂單 (${groupSize}筆)</span>
                                ${isPartiallySelected ? '<span style="color:#ef4444; font-weight:900;">⚠️ 建議一起勾選</span>' : ''}
                            </div>
                            ${infoMsg ? infoMsg.replace('flex:1; margin-left:10px;', 'width:100%; margin-top:4px;') : ''}
                        </div>
                        ${groupInnerHtml}
                    </div>`;
            } else {
                html += groupInnerHtml;
            }
            
            i += groupSize;
        }
        
        c.innerHTML = html;
        updateSelectedStats();
    }

        dispatchSelectedIds.forEach(id => {
            const t = dispatchAllTasks.find(x => x.id === id);
            if (t) totalW += Number(t.weight || 0);
        });

    function renderDriverDashboard_V7() {
        if (!document.getElementById('driverLoadDashboard')) return;
        
        const h = dispatchDrivers.map(d => {
            const plate = d.plate;
            const currentLoad = dispatchAllTasks.filter(t => {
                const isMatched = (String(t.assignedDriver).trim() === d.name.trim() || String(t.vehicle).trim() === plate.trim());
                const isFinished = (t.status && (t.status.includes('完成') || t.status.includes('送達') || t.status.includes('結案')));
                return isMatched && !isFinished;
            }).reduce((sum, tk) => sum + (Number(tk.weight) || 0), 0);
            const maxWeight = (plate.includes('BX') || plate.includes('BND')) ? 6000 : 3500;
            const pct = Math.min(100, (currentLoad / maxWeight) * 100);
            const barColor = pct >= 90 ? 'var(--color-danger)' : pct >= 70 ? 'var(--color-accent)' : 'var(--color-success)';
            return `
                    <div class="driver-weight-card" onclick="handleDriverClick('${escapeHTML(plate)}','${escapeHTML(d.name)}')">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <b style="color:${getDriverColor(d.name)}; font-size:15px;">${escapeHTML(d.name)}</b>
                            <span style="font-size:10px; color:var(--color-primary); font-family:'Rajdhani';">${escapeHTML(plate)}</span>
                        </div>
                    <div class="load-bar-bg"><div class="load-bar-fill" style="width:${pct}%; background:${barColor};"></div></div>
                    <div style="display:flex; justify-content:space-between; margin-top:5px; font-weight:900; font-size:13px;">
                        <span style="color:${barColor};">${currentLoad.toFixed(0)} <span style="font-size:10px;">kg</span></span>
                        <span style="color:#94a3b8;">${pct.toFixed(0)}%</span>
                    </div>
                </div>`;
        }).join('');

        const externalDrivers = [
            { plate: "外車-1", name: "外車 1" },
            { plate: "外車-2", name: "外車 2" },
            { plate: "外車-3", name: "外車 3" }
        ];

        let subRowsHtml = externalDrivers.map(d => {
            const currentLoad = dispatchAllTasks.filter(t => {
                const isMatched = (String(t.assignedDriver).trim() === d.name.trim() || String(t.vehicle) === d.plate);
                const isFinished = (t.status && (t.status.includes('完成') || t.status.includes('送達') || t.status.includes('結案')));
                return isMatched && !isFinished;
            }).reduce((sum, tk) => sum + (Number(tk.weight) || 0), 0);

            return `
                <div class="external-sub-row" onclick="handleDriverClick('${escapeHTML(d.plate)}','${escapeHTML(d.name)}')">
                    <b>${escapeHTML(d.plate)}</b>
                    <span style="color:#94a3b8; font-size:11px;">${currentLoad.toFixed(0)} kg</span>
                </div>`;
        }).join('');

        const extH = `
            <div class="driver-weight-card" style="padding:0; border-color:#a855f7; display:flex; flex-direction:column; min-width:135px; overflow:hidden;">
                <div style="background:#a855f7; color:#fff; font-size:10px; font-weight:900; text-align:center; padding:2px 0;">外車</div>
                ${subRowsHtml}
            </div>`;

        document.getElementById('driverLoadDashboard').innerHTML = (h + extH) || '<div style="color:#475569; padding:20px; text-align:center;">載入中...</div>';
    }

    }

    function showDriverDispatchList_V8(n, driverName) {
        if (isTouchDevice()) {
            alert('手機版不支援手指拖曳排序，請用電腦操作。');
        }

        const allDriverTasks = dispatchAllTasks.filter(t => t.assignedDriver === driverName || t.vehicle === n);
        const tasks = allDriverTasks.filter(t => dv === 'all' || t.date === dv).sort((a, b) => (a.order || 999) - (b.order || 999));
        const dragTip = isTouchDevice()
            ? '<span style="color:#ef4444; font-size:13px; font-weight:bold;">⚠️ 手機版不支援拖曳排序</span>'

    function copyFilteredList() {
        const dv = document.getElementById('filterDate').value;
        const bv = document.getElementById('filterBranch').value;
        const prv = document.getElementById('filterDriver').value;
        const items = dispatchAllTasks.filter(t => {
            const dOk = dv === 'all' || t.date === dv;
            const bOk = bv === 'all' || (t.branch || '').includes(bv);
            let pOk = true;
            if (prv === 'unassigned') pOk = !t.assignedDriver || t.assignedDriver === "";
            else if (prv !== 'all') pOk = t.assignedDriver === prv || t.vehicle === prv;
            return dOk && bOk && pOk;
        });
        const m = document.getElementById('sortMode').value;
        const norm = a => scrubAddress(a).replace(/\s/g, '').replace(/[０-９]/g, x => String.fromCharCode(x.charCodeAt(0) - 0xFEE0));
        items.sort((a, b) => {
            const aAssigned = (!!a.assignedDriver && a.assignedDriver !== "") || (a.status !== '待指派' && a.status !== '');
            const bAssigned = (!!b.assignedDriver && b.assignedDriver !== "") || (b.status !== '待指派' && b.status !== '');
            if (aAssigned !== bAssigned) return aAssigned ? 1 : -1;
            if (m === 'driver') {
                const da = a.assignedDriver || a.vehicle || 'ZZZ';
                const db = b.assignedDriver || b.vehicle || 'ZZZ';
                return da.localeCompare(db, 'zh-TW');
            }
            if (m === 'time') return (a.timeSlot || 'ZZZ').localeCompare(b.timeSlot || 'ZZZ', 'zh-TW');
            if (m === 'customer') return a.customer.localeCompare(b.customer, 'zh-TW');
            return norm(a.address).localeCompare(norm(b.address), 'zh-TW');
        });
        let bgColor = '#0f172a',
            borderColor = '#38bdf8';
        if (bv === '安帝嘉') {
            bgColor = '#064e3b';
            borderColor = '#10b981';
        } else if (bv === '高雅瓷') {
            bgColor = '#450a0a';
            borderColor = '#f87171';
        } else if (bv === '喜悅納') {
            bgColor = '#1e3a8a';
            borderColor = '#60a5fa';
        }
        generateListImage(bv !== 'all' ? `${bv} 篩選清單` : `當前篩選清單`, items, {
            showBranch: true,
            showDriver: true,
            bgColor: bgColor,
            borderColor: borderColor
        });
    }

    function generateDriverImage(n, drvName) {
        const dv = document.getElementById('filterDate').value;
        let t = dispatchAllTasks.filter(t => String(t.assignedDriver).trim() === drvName.trim() || t.vehicle === n);
        if (dv !== 'all') t = t.filter(x => x.date === dv);
        t.sort((a, b) => {
            if (a.isBackYingge !== b.isBackYingge) return a.isBackYingge ? -1 : 1;
            return (a.order || 999) - (b.order || 999);
        });
        generateListImage(`派遣清單 - ${drvName} ${dv !== 'all' ? '(' + dv + ')' : ''}`, t, {
            showBranch: true,
            showDriver: true,
            highlightYingge: true
        });
    }

    function copyToWarehouse() {
        const dv = document.getElementById('filterDate').value;
        const items = dispatchAllTasks.filter(t => t.isBackYingge && (dv === 'all' || t.date === dv));
        items.sort((a, b) => String(a.assignedDriver || a.vehicle).localeCompare(String(b.assignedDriver || b.vehicle), "zh-TW"));
        generateListImage(`回鶯歌清單 ${dv !== 'all' ? '(' + dv + ')' : ''}`, items, {
            showBranch: true,
            showDriver: true,
            triggerBtnId: 'copyToWarehouseBtn'
        });
    }

    function copyToLINE() {
        const targets = Array.from(dispatchSelectedIds).map(id => dispatchAllTasks.find(t => t.id === id)).filter(Boolean);
        generateListImage("選取清單", targets, {
            showBranch: true,
            showDriver: true,
            highlightYingge: true,
            triggerBtnId: 'copyToLINEBtn'
        });
    }

        tpl.innerHTML = `

                ${items.map((t, i) => {
                    const tKey = norm(t.address) + '_' + (t.size || '') + '_' + (t.boxes || '') + '_' + (t.branch || '');
                    const isDuplicate = addrCounts[tKey] > 1;
                    
                    const brObj = getOrderTint(t.id, t.branch);
                    const tDisplayId = formatDisplayOrderId(t.id, t.branch);

                    let drvHtml = '';
                    if (opts.showDriver && (t.assignedDriver || t.vehicle)) {
                        drvHtml = `<span style="background:${getDriverColor(t.assignedDriver || t.vehicle)}; color:#000; padding:2px 6px; border-radius:4px; font-size:11px; margin-left:auto; font-weight:900;">${escapeHTML(t.assignedDriver || t.vehicle)}</span>`;
                    }
                    let yinggeHtml = '';
                    if (opts.highlightYingge && t.isBackYingge) {
                        yinggeHtml = `<span style="background:var(--color-accent); color:#000; padding:1px 5px; border-radius:4px; font-size:10px; font-weight:900; margin-left:4px;">[回]</span>`;
                    }
                    let shippingHtml = t.shippingType ? `<span style="background:#f59e0b; color:#000; padding:1px 5px; border-radius:4px; font-size:10px; font-weight:900; margin-left:4px;">${escapeHTML(t.shippingType)}</span>` : '';
                    let dupHtml = isDuplicate ? '<span style="color:#ef4444; font-weight:900; font-size:10px; border:1px solid #ef4444; padding:0 3px; border-radius:4px; margin-left:4px;">重</span>' : '';
                    return `
                    <div style="background:linear-gradient(135deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9)); border-radius:8px; padding:10px; margin-bottom:6px; border:1px solid rgba(255,255,255,0.05); display:flex; flex-direction:column; gap:6px;">
                        <div style="display:flex; align-items:center; gap:8px; flex-wrap: wrap;">
                            <span style="font-weight:900; color:rgba(255,255,255,0.3); font-size:14px; min-width:20px;">${i + 1}.</span>
                            <span style="font-weight:900; color:#38bdf8; font-size:16px;">${(function () {
                                var raw = String(t.customer || '');
                                var cleaned = raw.replace(/(股份有限公司|有限公司|實業|設計|建材|工程|工作室|公司|商行|企業|磁磚|五金)/g, '').trim();
                                return cleaned.length > 0 ? cleaned.substring(0, 2) : raw.substring(0, 2);

                            ${t.isReturn ? '<span style="color:#ef4444; font-weight:900; font-size:13px; border:1px solid #ef4444; padding:0 4px; border-radius:4px;">退</span>' : ''}

                            ${yinggeHtml}
                            <b style="color:${getWeightColor(t.weight)}; font-size:20px; font-family:'Rajdhani';">${t.weight.toFixed(0)}kg</b>

                                <img src="${blobUrl}" style="max-width:100%; max-height:80vh; box-shadow:0 10px 40px rgba(0,0,0,0.5); border-radius:12px; border:1px solid rgba(255,255,255,0.1); object-fit:contain;">
                                <div style="margin-top:20px; color:#64748b; font-size:12px;">小提示：也可以直接右鍵另存圖片喔！</div>
                            </body>
                        `);
                        w.document.close();
                    };
                }, "image/png");
                // 移除自動複製邏輯
            }).catch(err => {
                if (triggerBtn) {
                    triggerBtn.innerHTML = oldHtml;
                    triggerBtn.disabled = false;
                }
                console.error("html2canvas Error:", err);
                showToast("❌ 繪製失敗: " + err.message);
            });
        }, 1000); // 增加延遲確保渲染完成
    }

    function handleCardClick_V7(id) {
        const t = dispatchAllTasks.find(x => x.id === id);
        if (t && t.thumbnail) {
            document.getElementById("dispatchVoucherImg").src = t.thumbnail;
            document.getElementById("dispatchVoucherImg").style.display = "block";
            document.getElementById("dispatchVoucherPlaceholder").style.display = "none";
        }
        applyFilters_V3();
    }

    function toggleSelectionByCheckbox(e, id) {
        e.stopPropagation();
        const norm = a => scrubAddress(a).replace(/\s/g, '').replace(/[０-９]/g, x => String.fromCharCode(x.charCodeAt(0) - 0xFEE0));
        const targetTask = dispatchAllTasks.find(t => t.id === id);
        if (!targetTask) return;
        
        const targetK = norm(targetTask.address);
        const isCurrentlySelected = dispatchSelectedIds.has(id);
        
        if (!isCurrentlySelected) {
            // 僅勾選當前點擊的項目 (取消自動連動全選)
            dispatchSelectedIds.add(id);
        } else {
            // 取消勾選該筆
            dispatchSelectedIds.delete(id);
        }

        updateSelectedStats();
        applyFilters_V3();
    }

    function toggleYinggeRemote(e, id, isB) {
        e.stopPropagation();
        const t = dispatchAllTasks.find(x => x.id === id);
        if (t) {
            t.isBackYingge = isB;
            // 🔄 即時更新 UI，並在背景存檔
            google.script.run
                .withSuccessHandler(res => {
                    if(!res.success) showToast("❌ 存檔失敗: " + res.error);
                })
                .withFailureHandler(err => {
                    showToast("❌ 伺服器錯誤: " + err);
                    // 失敗時恢復 UI 狀態
                    t.isBackYingge = !isB;
                    applyFilters_V3();
                })
                .updateBackYinggeStatus_V3(id, "", isB);
            applyFilters_V3();
        }
    }

    function showToast(m) {
        const t = document.createElement('div');
        t.innerText = m;
        t.style.cssText = "position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:12px 24px;border-radius:30px;z-index:1000002;border:2px solid #38bdf8;";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    function quickDispatch_V7(plate, name) {
        const tasks = Array.from(dispatchSelectedIds).map(id => dispatchAllTasks.find(x => x.id === id)).filter(Boolean);
        if (tasks.length === 0) return;
        if (!confirm(`⚠️ 防呆確認\n\n確定要將已選取的 ${tasks.length} 筆訂單，指派給「${name}」嗎？\n\n(此確認用來防止原本訂單意外跑到同一個人身上)`)) return;
        showToast("分派中...");
        google.script.run.withSuccessHandler(() => {
            dispatchSelectedIds.clear();
            openDispatchModal_V3();
            showToast("✅ 分派成功");
        }).recordDispatch_V3(tasks, {
            plate: plate,
            name: name,
            shift: "1"
        });
    }

    function cancelDispatchAction(id) {
        google.script.run.withSuccessHandler(() => {
            openDispatchModal_V3();
            showToast("✅ 已撤回");
        }).cancelDispatch_V3(id);
    }

    function escapeHTML(str) {
        return str ? str.replace(/[&<>"']/g, m => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        } [m])) : '';
    }

    function searchByAddress(event, addr) {
        if (event) event.stopPropagation();
        const input = document.getElementById('searchQuery');
        if (!input) return;
        input.value = addr;
        applyFilters_V3();
        // 捲動到區域頂部
        document.getElementById('unifiedTaskList').scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ==========================================
    // 🔴 V11.20: 退回分公司邏輯組 (批次優化版)
    // ==========================================
    function openReturnModalFromSelection() {
        if(dispatchSelectedIds.size === 0) return showToast("⚠️ 請先勾選要退回的訂單");
        
        pendingReturnSet.clear();
        dispatchSelectedIds.forEach(id => pendingReturnSet.add(id));
        
        showReturnSummary();
    }

    function showReturnSummary() {
        if(pendingReturnSet.size === 0) return;
        const modal = document.getElementById('returnConfirmModal');
        const list = document.getElementById('returnItemsList');
        modal.style.display = 'flex';
        
        const tasks = Array.from(pendingReturnSet).map(id => dispatchAllTasks.find(t => t.id === id)).filter(Boolean);
        list.innerHTML = tasks.map(t => `
            <div style="display:flex; flex-direction:column; border-bottom:1px solid #1e293b; padding:8px; gap:5px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="color:#fff; font-weight:bold; font-size:13px;">${t.customer} (${t.id})</span>
                    <span style="color:#94a3b8; cursor:pointer; font-size:16px;" onclick="removeFromPendingReturn('${t.id}')">✕</span>
                </div>
                <div style="display:flex; gap:5px;">
                    <select class="item-reason-select" data-id="${t.id}" onchange="updateLinePreview()" style="flex:1; background:#020617; color:#fff; border:1px solid #475569; padding:4px; border-radius:4px; font-size:12px;">
                        <option value="路線不順">路線不順</option>
                        <option value="重量過重">重量過重</option>
                        <option value="時間不合">時間不合</option>
                        <option value="其它">其它 (手動輸入)</option>
                    </select>
                    <input type="text" class="item-other-input" data-id="${t.id}" oninput="updateLinePreview()" placeholder="輸入原因..." style="display:none; flex:1; background:#020617; color:#fff; border:1px solid #475569; padding:4px; border-radius:4px; font-size:12px;">
                </div>
            </div>
        `).join('');

        // 初始化「其它」輸入框的顯示邏輯
        list.querySelectorAll('.item-reason-select').forEach(sel => {
            sel.addEventListener('change', function() {
                const other = list.querySelector(`.item-other-input[data-id="${this.dataset.id}"]`);
                other.style.display = (this.value === '其它') ? 'block' : 'none';
            });
        });

        updateLinePreview();
    }

    function applyGlobalReason() {
        const val = document.getElementById('globalReasonSelect').value;
        if(!val) return;
        document.querySelectorAll('.item-reason-select').forEach(sel => {
            sel.value = val;
            const other = document.querySelector(`.item-other-input[data-id="${sel.dataset.id}"]`);
            other.style.display = 'none';
        });
        updateLinePreview();
    }

    function removeFromPendingReturn(id) {
        pendingReturnSet.delete(id);
        if(pendingReturnSet.size === 0) closeReturnModal();
        else showReturnSummary();
    }

    function closeReturnModal() {
        document.getElementById('returnConfirmModal').style.display = 'none';
    }

    function updateLinePreview() {
        const tasks = Array.from(pendingReturnSet).map(id => dispatchAllTasks.find(t => t.id === id)).filter(Boolean);
        if(tasks.length === 0) return;

        // V11.23: 日期去掉年份
        const d = new Date();
        const dateStr = `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        let msg = `🌀 ${dateStr} 退回清單 🌀\n\n`;
        
        const byBranch = {};
        tasks.forEach(t => {
            const b = t.branch || '其它';
            if(!byBranch[b]) byBranch[b] = [];
            
            const sel = document.querySelector(`.item-reason-select[data-id="${t.id}"]`);
            const other = document.querySelector(`.item-other-input[data-id="${t.id}"]`);
            const reason = (sel && sel.value === '其它') ? (other ? other.value : '其它') : (sel ? sel.value : '路線不順');
            
            t._tempReason = reason;
            byBranch[b].push(t);
        });

        const colors = ["🟧", "🟩", "🟨", "🟪", "🟦", "🟥", "⬜"];
        const lines = [];
        
        for(let b in byBranch) {
            lines.push(`❌ 退回${b} ❌`);
            byBranch[b].forEach((t, idx) => {
                const color = colors[idx % colors.length];
                
                // V11.24: 地址過濾更乾淨 (先去掉縣市)
                const cleanAddr = (t.address || "").replace(/^(台北市|臺北市|新北市|桃園市|基隆市|[\u4e00-\u9fff]{2,3}[縣市])/g, '');
                const addrMatch = cleanAddr.match(/([\u4e00-\u9fff]{2}區)([\u4e00-\u9fff0-9a-zA-Z]+[路街])/);
                const displayAddr = addrMatch ? (addrMatch[1] + addrMatch[2]) : scrubAddress(cleanAddr);

                lines.push(`${color} ${t.customer}`);
                lines.push(`${color} ${t.id}`);
                lines.push(`${color} ${displayAddr}`);
                lines.push(`${color} 原因：${t._tempReason}`);
                if(t.thumbnail) {
                    lines.push(`${color} ${t.thumbnail}`); // V11.24: 直接秀網址
                }
                if(idx < byBranch[b].length - 1) lines.push("");
            });
            lines.push("➖➖➖➖➖");
        }
        
        document.getElementById('linePreviewText').innerText = msg + lines.join('\n');
    }

    function executeBatchReturn() {
        const tasks = Array.from(pendingReturnSet).map(id => dispatchAllTasks.find(t => t.id === id)).filter(Boolean);
        if(tasks.length === 0) return;

        const updates = tasks.map(t => {
            const sel = document.querySelector(`.item-reason-select[data-id="${t.id}"]`);
            const other = document.querySelector(`.item-other-input[data-id="${t.id}"]`);
            const reason = (sel && sel.value === '其它') ? (other ? other.value : '其它') : (sel ? sel.value : '路線不順');
            return { id: t.id, reason: reason };
        });

        const msg = document.getElementById('linePreviewText').innerText;
        const btn = document.getElementById('execReturnBtn');
        const originalText = btn.innerText;
        btn.disabled = true;
        btn.innerText = "⏳ 處理中，請稍候...";
        btn.style.background = "#6b7280";

        google.script.run.withSuccessHandler(res => {
            btn.disabled = false;
            btn.innerText = originalText;
            btn.style.background = "#a855f7";
            if(res.success) {
                // V11.26: 停止縮網址，直接發送
                google.script.run.pushLineMessage_V11(msg);
                pendingReturnSet.clear();
                dispatchSelectedIds.clear();
                closeReturnModal();
                openDispatchModal_V3(); 
                showToast("✅ 已完成退回並發送 LINE");
            } else {
                showToast("❌ 錯誤: " + res.error);
            }
        }).adminBatchReturnTasks_V11(updates);
    }
</script>
